name: Release

# Pushing a `v*` tag builds the offline bundles and publishes them.
#
# CI is the backstop for the pre-push hook: hooks are not versioned, so a
# machine that never ran `tools/install_hooks.sh` still cannot cut a release
# whose bundle does not build. The tag is checked against `VERSION` before
# anything is built -- a release whose contents do not match its number is the
# one artefact this project must never produce, because it is what the updater
# trusts.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag and VERSION must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(cat VERSION)"
          if [ "$tag" != "$file" ]; then
            echo "::error::tag v$tag != VERSION $file"
            exit 1
          fi

      - name: Build both bundles
        # The portable bundle first, then the Windows one; the second run adds
        # its artefact to the same manifest.json rather than replacing it.
        run: |
          python -m pip install --upgrade pip wheel
          python tools/build_dist.py --release
          python tools/build_dist.py --release --windows

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # The generated notes list the commits; this preamble says the things
        # a commit list cannot -- which zip to take, and why the first public
        # release is numbered 1.4.0 rather than 1.0.0.
        run: |
          cat > /tmp/notes.md <<'NOTES'
          Ferramentas de comissionamento de proteção, automação e controle.

          **Qual arquivo baixar**

          | | |
          |---|---|
          | `pac-ct-<versao>-win_amd64.zip` | Windows |
          | `pac-ct-<versao>.zip` | Linux / macOS |

          Os dois trazem `vendor/` — um wheel por dependência — porque a
          instalação é **offline**: uma subestação normalmente não tem rede.
          Descompacte em `PAC-CT/versions/<versao>/` e siga o `INSTALAR.txt`
          que vem dentro. Requer Python 3.10 ou mais novo.

          Confira o download antes de instalar: os sha256 estão em
          `SHA256SUMS` e em `manifest.json` — é o mesmo valor que o
          `--atualizar` verifica sozinho antes de descompactar qualquer coisa.

          **Por que 1.4.0 e não 1.0.0**

          Este é o primeiro lançamento público, mas não o primeiro lançamento:
          a numeração continua a linha v1.1 / v1.2 / v1.3 que existia no
          repositório privado de onde o projeto veio.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            --title "PAC CT $GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --generate-notes \
            dist/pac-ct-*.zip dist/manifest.json dist/SHA256SUMS
