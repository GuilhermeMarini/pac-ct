name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.13 is the floor `requires-python` declares; 3.14 is the newest
        # release. The floor moved from 3.10 on 2026-09-15 because the
        # `py61850>=0.5.0` pin declares `>=3.13` itself.
        #
        # **3.13 did not stop being the interesting row; it became the floor
        # one.** It is where `telnetlib` was REMOVED from the standard library,
        # and the vendored `selprotopy` still does a bare `import telnetlib` --
        # `pacct/compat.py` aliases `telnetlib3`'s backport into `sys.modules`
        # to cover it. That backport used to be exercised by one interior job
        # out of five; now EVERY job runs at or above the removal, so nothing
        # here ever takes the standard library's `telnetlib` again and a
        # backport that stopped being a drop-in would fail the whole matrix
        # rather than one row of it. That is a strictly better guard, and it is
        # why this comment is rewritten rather than deleted.
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # `--pre` is a leftover from when py61850 shipped only pre-releases and
        # `requirements.txt` had to name one. It has named a FINAL since 0.3.0
        # and the note there now forbids naming a pre-release while a final
        # exists, so the flag guards nothing -- it only widens what a resolver
        # may pick. Dropped with the 0.5.0 pin.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Types
        run: python -m mypy
      - name: Tests
        # The IEC 61850 fixtures that need the factory ICD corpus skip on CI:
        # those files are the manufacturer's and are not in this repository.
        run: python -m pytest tests/ -q

      - name: Bundle
        # The distributable has to still BUILD from this tree. `--no-vendor`
        # keeps it to seconds -- the wheels are fetched by the release job,
        # and they are not what breaks. This is the backstop for the pre-push
        # hook, which is not versioned and may never have been installed.
        run: python tools/build_dist.py --no-vendor

  frontend:
    # The frontend is BUILT output that is committed (stage 2, decision 3): a
    # clone with no node runs the application, and node is a dependency of
    # changing the frontend rather than of running it. The price of that
    # decision is exactly this job -- nothing else can notice that
    # `src/pacct/web/static/js/` has stopped matching `frontend/src/`.
    #
    # It is a separate job, not a step in `test`, because it shares nothing
    # with the Python matrix: it would run twice for no reason and a red
    # rebuild would be reported as a Python failure.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The exact version, from the file the developer's shell reads too.
          # This job is the reason it is exact rather than a major: the check
          # below is a byte comparison, so a floating node would surface here
          # as an intermittent failure with no code change behind it.
          node-version-file: frontend/.nvmrc
      - name: Install
        # `npm ci`, never `npm install`: it installs the lockfile exactly and
        # refuses when `package.json` and the lock disagree. No `cache:` on the
        # setup step on purpose -- 14 packages install in seconds, and "it
        # passed because the cache was warm" is the failure this whole phase
        # exists to prevent.
        run: npm ci
        working-directory: frontend
      - name: Types
        # The gate Vite cannot be. `vite build` transpiles TypeScript with
        # esbuild, which STRIPS the annotations without reading them: a green
        # build below proves the bundle was produced, never that it is
        # type-correct. This step is the only thing in CI that reads a type.
        #
        # It is a step in this job rather than a job of its own because it
        # shares everything with the build -- the same node, the same
        # `node_modules`, the same checkout -- so a separate job would pay a
        # second `npm ci` for a name this step's own name already gives. That
        # is the opposite of the reasoning that made `frontend` separate from
        # `test`, and deliberately so: THAT split shared nothing.
        #
        # Before the build, so a type error fails as a type error instead of
        # arriving afterwards as a stale-output diff that names the wrong file.
        run: npm run typecheck
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
      - name: The committed output is what the build produces
        # `actions/checkout` gave a clean tree, so anything the build changed
        # is a file whose commit is stale. The diff is the whole assertion; the
        # status is printed so the log names the file instead of only the fact.
        run: |
          if ! git diff --quiet; then
            echo "::error::The committed build output is stale. Run 'npm run build' in frontend/ and commit the result."
            git status --porcelain
            git diff --stat
            exit 1
          fi
          echo "Committed output matches a fresh build."
