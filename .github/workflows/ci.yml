name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor `requires-python` declares; 3.14 is the newest
        # release. 3.13 is not optional cover: it is where `telnetlib` was
        # REMOVED from the standard library, and the vendored `selprotopy`
        # still does a bare `import telnetlib` -- `pacct/compat.py` aliases
        # `telnetlib3`'s backport into `sys.modules` to cover it, and this is
        # the job that would notice if the backport ever stopped being a
        # drop-in.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        # --pre: py61850 ships as a pre-release and the specifier says so, but
        # the flag keeps a resolver that ignores that from failing the job.
        run: |
          python -m pip install --upgrade pip
          pip install --pre -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Types
        run: python -m mypy
      - name: Tests
        # The IEC 61850 fixtures that need the factory ICD corpus skip on CI:
        # those files are the manufacturer's and are not in this repository.
        run: python -m pytest tests/ -q

      - name: Bundle
        # The distributable has to still BUILD from this tree. `--no-vendor`
        # keeps it to seconds -- the wheels are fetched by the release job,
        # and they are not what breaks. This is the backstop for the pre-push
        # hook, which is not versioned and may never have been installed.
        run: python tools/build_dist.py --no-vendor
