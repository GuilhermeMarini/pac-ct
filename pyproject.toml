[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pac-ct"
description = "Protection, Automation & Control Commissioning Toolkit — web tools for commissioning SEL relays and IEC 61850 systems"
readme = "README.md"
# 3.13, raised from 3.10 on 2026-09-15. It is NOT a preference: the
# `py61850>=0.5.0` pin below declares `>=3.13` itself, so this project cannot
# be installed below it, and a `requires-python` that claimed otherwise would
# be a lie a resolver discovers for the user. 3.13 is also where `telnetlib`
# left the standard library, which used to be an interior row of the CI matrix
# and is now the floor -- so `pacct/compat.py`'s backport is exercised on every
# job rather than on one.
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Guilherme Marini" }]
keywords = ["sel", "iec61850", "protection", "commissioning", "scada", "dnp3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Manufacturing",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]

# Exactly requirements.txt. That file stays: `app.py` bootstraps from it, and
# a substation installs from the offline bundle, never from an index.
dependencies = [
    "pyserial>=3.5",
    "telnetlib3>=4.0.2",
    "olefile>=0.47",
    # Kept identical to requirements.txt -- `tests/test_version.py` fails when
    # the two disagree, since a bundle built from one and a venv built from the
    # other is the kind of difference nobody notices until a relay is on the
    # bench.
    "cfbwrite>=1.0",
    "SELlib>=3.0.1",
    "openpyxl>=3.1",
    # Both the GLV's MMS transport and, since 0.3.0, the IEC 61850-6 reader
    # four tools here read an SCD through. A FINAL, not a pre-release: a
    # specifier naming a `.devN` tells the resolver pre-releases are eligible
    # for that requirement, which would let a future `0.5.0.dev1` in silently.
    # Floor and ceiling moved together on 2026-09-11 and again on 2026-09-15,
    # each time deliberately and each time only after the seam nothing in CI
    # checks was measured. 0.5.0 adds the SCL EDIT layer: 31 public names
    # become 132, none removed and none changed in meaning, verified name by
    # name against the 0.4.0 release; 935 tests here and 275 in SELlib pass
    # against it. One supported library line, and it is the tested one.
    # **This pin is what forces `requires-python` above**: py61850 0.5.0
    # declares `>=3.13`, so below that a resolver is served 0.4.0, which this
    # pin does not admit. See requirements.txt for the full note, and raise
    # the ceiling deliberately or not at all.
    "py61850>=0.5.0,<0.6",
]

[project.optional-dependencies]
# Kept in step with requirements-dev.txt by hand -- that file is what CI
# installs, this extra is what `pip install -e .[dev]` gives. They must
# agree or `mypy` passes on one and not the other.
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11", "types-openpyxl"]

[project.urls]
Homepage = "https://github.com/GuilhermeMarini/pac-ct"
Source = "https://github.com/GuilhermeMarini/pac-ct"

[project.scripts]
pac-ct = "pacct.web.dashboard:main"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pacct = ["web/**/templates/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
# `src` for the package, `.` for the vendored selprotopy at the project root.
pythonpath = ["src", "."]
testpaths = ["tests"]
