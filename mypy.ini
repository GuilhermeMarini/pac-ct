[mypy]
python_version = 3.13
files = src/pacct
namespace_packages = True
explicit_package_bases = True
mypy_path = src
# The whole of `src/pacct` is checked. It was adopted package by package --
# `core/`, `parsers/` and `matchers/` first, since they are what
# `docs/MIGRATION.md` Phase 4 extracted into `cfbwrite` and `sellib` and a
# library ships its types -- and `web/` and `cli/` followed, which is the
# backlog REVIEW.md S8 describes. Nothing is silenced by package any more.
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True

# Vendored, patched, hook-protected: not ours to type.
[mypy-selprotopy.*]
ignore_errors = True
follow_imports = skip

[mypy-olefile.*]
ignore_missing_imports = True
[mypy-telnetlib3.*]
ignore_missing_imports = True
# `telnetlib` itself, which typeshed stopped shipping stdlib stubs for at
# python_version = 3.13 -- the very removal `pacct/compat.py` exists to paper
# over. The three call sites import it inside `ensure_telnetlib()`'s shadow,
# so what mypy resolves is the `telnetlib3` backport aliased into
# `sys.modules`, and that package ships no py.typed. Same treatment as its
# parent, one line above, and it appeared the day the floor moved to 3.13.
[mypy-telnetlib]
ignore_missing_imports = True
[mypy-py61850.*]
ignore_missing_imports = True
