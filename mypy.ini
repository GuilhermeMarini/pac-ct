[mypy]
python_version = 3.10
files = src/pacct
namespace_packages = True
explicit_package_bases = True
mypy_path = src
# The whole of `src/pacct` is checked. It was adopted package by package --
# `core/`, `parsers/` and `matchers/` first, since they are what
# `docs/MIGRATION.md` Phase 4 extracted into `cfbwrite` and `selfiles` and a
# library ships its types -- and `web/` and `cli/` followed, which is the
# backlog REVIEW.md S8 describes. Nothing is silenced by package any more.
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True

# Vendored, patched, hook-protected: not ours to type.
[mypy-selprotopy.*]
ignore_errors = True
follow_imports = skip

[mypy-olefile.*]
ignore_missing_imports = True
[mypy-telnetlib3.*]
ignore_missing_imports = True
[mypy-py61850.*]
ignore_missing_imports = True
