[mypy]
python_version = 3.10
files = src/pacct
namespace_packages = True
explicit_package_bases = True
mypy_path = src
# Adopted package by package, which is the only way to put mypy on an existing
# tree without a wall of noise nobody reads. `core/`, `parsers/` and
# `matchers/` are CLEAN and must stay clean -- they are exactly the code
# `docs/MIGRATION.md` Phase 4 extracts into `cfbwrite` and `selfiles`, and a
# library ships its types. `web/` and `cli/` still carry ~110 findings
# (REVIEW.md S8), most of them one root cause each: `SessionHandler` declares
# neither `server_sessions` nor `state_factory`, and `self.session` is
# `Session | None` at every use even though the dispatcher guarantees it. They
# are silenced HERE, in one visible place with a reason, instead of by
# scattering `# type: ignore`.
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True

# Vendored, patched, hook-protected: not ours to type.
[mypy-selprotopy.*]
ignore_errors = True
follow_imports = skip

[mypy-olefile.*]
ignore_missing_imports = True
[mypy-telnetlib3.*]
ignore_missing_imports = True
[mypy-py61850.*]
ignore_missing_imports = True

# -- the backlog, not a verdict ---------------------------------------------
# Remove a line here as that package is typed; do not add one.
[mypy-pacct.web.*]
ignore_errors = True

[mypy-pacct.cli.*]
ignore_errors = True
