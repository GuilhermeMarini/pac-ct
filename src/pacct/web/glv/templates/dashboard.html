<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>SEL-411L Logic Live Dashboard</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0; font-family: var(--sans);
    background: var(--bg); color: var(--text);
    display: grid;
    grid-template-columns: 1fr 280px;
    grid-template-rows: auto auto auto 1fr;   /* header, abas, paginas, viewer */
    grid-template-areas:
      "header header"
      "tabs   tabs"
      "pages  pages"
      "viewer panel";
    min-height: 100vh;
  }
  body.panel-collapsed { grid-template-columns: 1fr 0; }
  /* Faixa de abas: um diagrama por aba, com o estado da conexao na propria
     aba. Fica ACIMA da faixa de paginas do GLE -- primeiro se escolhe o
     diagrama, depois a pagina dele. */
  /* QUEBRA, nao rola. `overflow-x: auto` numa faixa de uma linha so' escondia
     as abas seguintes atras de uma barra de rolagem horizontal: com o teto em
     10 diagramas, metade deles ficava fora da tela e nada na faixa dizia que
     havia mais. A faixa de paginas logo abaixo (`#pages`) sempre quebrou --
     agora as duas se leem igual. A linha do grid e' `auto`, entao a faixa
     cresce em altura sozinha. O `nowrap` desce pro ITEM: a faixa quebra entre
     abas, nunca dentro do nome de uma. */
  #tabs {
    grid-area: tabs; display: flex; flex-wrap: wrap; align-items: center;
    gap: var(--s1);
    padding: var(--s1); background: var(--surface);
    border-bottom: 1px solid var(--border-ctl);
  }
  #tabs .tab, #tabs .tab-new { white-space: nowrap; }
  /* Um nome de rele do corpo real vai a 24 caracteres
     (`QPC1_LT1_UPC1_SECC_GAMA`), e com `nowrap` a aba fica do tamanho do
     texto. Quebrar entre abas nao salva de UMA aba mais larga que a tela --
     um item de flex nao quebra dentro de si. O titulo completo (rele, GLE e
     IP) ja esta no `title` da aba, entao o corte nao esconde nada. */
  #tabs .tab .label {
    max-width: 22ch; overflow: hidden; text-overflow: ellipsis;
  }
  #tabs .tab {
    display: inline-flex; align-items: center; gap: var(--s1);
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border-ctl); border-radius: var(--radius);
    padding: var(--s1) var(--s2); font-size: 11px; cursor: pointer;
  }
  #tabs .tab:hover { background: var(--surface-3); }
  #tabs .tab.active {
    background: var(--accent-strong); border-color: var(--accent-strong);
    color: var(--accent-fg);
  }
  #tabs .tab .ip { font-family: var(--mono); font-size: 10px; opacity: .75; }
  #tabs .tab .dot {
    width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px;
    background: var(--text-3);
  }
  #tabs .tab[data-status="live"] .dot { background: var(--ok); }
  #tabs .tab[data-status="connecting"] .dot { background: var(--warn); }
  #tabs .tab[data-status="error"] .dot { background: var(--err); }
  #tabs .tab .shared { font-size: 10px; opacity: .8; }
  #tabs .tab .close {
    background: none; border: none; color: inherit; cursor: pointer;
    font-size: 12px; line-height: 1; padding: 0 2px; opacity: .7;
  }
  #tabs .tab .close:hover { opacity: 1; }
  #tabs .tab-new {
    background: var(--surface-2); color: var(--text);
    border: 1px dashed var(--border-ctl); border-radius: var(--radius);
    padding: var(--s1) var(--s2); font-size: 11px; cursor: pointer;
    text-decoration: none;
  }
  #tabs .tab-new:hover { background: var(--surface-3); }
  body.panel-collapsed #values-panel { display: none; }
  /* Cabecalho em DUAS faixas, e a divisao e' por assunto:
       linha 1 = de que rele estamos falando e como ele esta (identidade +
                 estado + as acoes que mudam esse estado);
       linha 2 = o que estamos fazendo com o desenho (busca, ferramentas,
                 zoom).
     Antes era uma faixa so, com titulo, estado, busca, ferramentas, zoom e
     cinco botoes disputando a mesma linha: em qualquer largura real ela
     quebrava sozinha e o corte caia num lugar diferente a cada tela, entao o
     nome do IED, a mensagem de erro e o campo de busca acabavam vizinhos sem
     relacao nenhuma. */
  header {
    grid-area: header; background: var(--surface);
    padding: var(--s2) var(--s3);
    display: flex; flex-direction: column; gap: 6px;
    /* `align-items` explicito: o shell dos temas manda `baseline` no
       `header`, o que numa coluna encolheria cada faixa ao seu conteudo e
       mataria o `.spacer` que empurra os botoes pra direita. A borda de baixo
       continua sendo a do tema. */
    align-items: stretch;
  }
  .hdr-row {
    display: flex; align-items: center; gap: var(--s2);
    /* ainda quebra em telas estreitas, mas agora cada faixa quebra dentro do
       proprio assunto */
    flex-wrap: wrap; row-gap: 6px;
  }
  .hdr-row-2 { border-top: 1px dotted var(--border); padding-top: 6px; }
  header .spacer { flex: 1 1 auto; }

  /* Identidade do diagrama: rele (o nome do IED) + arquivo GLE aberto. */
  .hdr-id { display: flex; align-items: baseline; gap: var(--s1); min-width: 0; }
  .hdr-id .eyebrow {
    font-size: 9px; color: var(--text-3); text-transform: uppercase;
    letter-spacing: 0.08em; flex: 0 0 auto;
  }
  header h1 {
    margin: 0; font-size: 14px; font-weight: 600;
    max-width: 34ch; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .hdr-id .gle {
    font-family: var(--mono); font-size: 11px; color: var(--text-2);
    max-width: 30ch; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
  }
  .hdr-id .gle::before { content: "·"; margin-right: var(--s1); color: var(--text-3); }

  /* --- Controles do cabecalho ------------------------------------------
     UMA pegada so: mesma altura, mesma fonte, mesmo raio, mesma borda -- pros
     quatro botoes soltos da linha 1 (`.hbtn`) e pros tres grupos da linha 2
     (busca, ferramentas, zoom). Antes cada botao tinha a sua regra copiada, e
     o #conn-toggle nao tinha nenhuma: saia com o desenho padrao do navegador,
     de outra fonte, outra altura e outro raio, bem ao lado de tres botoes
     iguais entre si. Cor aqui so quer dizer estado; forma e' sempre a mesma. */
  .hdr-row { --ctl-h: 26px; }
  .hbtn {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    height: var(--ctl-h); box-sizing: border-box; padding: 0 var(--s2);
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border-ctl); border-radius: var(--radius);
    font: 500 11px/1 var(--sans); text-decoration: none; white-space: nowrap;
    cursor: pointer;
  }
  .hbtn:hover { background: var(--surface-3); }
  .hbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .hbtn:disabled { opacity: .5; cursor: progress; }
  /* Conectar/Desconectar: mesma forma dos outros, so a cor conta o estado. */
  #conn-toggle[data-state="live"]  { color: var(--ok);  border-color: var(--ok); }
  #conn-toggle[data-state="error"] { color: var(--err); border-color: var(--err); }
  /* Notas alterna um painel: acende como as abas quando esta aberto. */
  body.notes-open #notes-toggle {
    background: var(--accent-strong); border-color: var(--accent-strong);
    color: var(--accent-fg);
  }
  /* Os grupos sao segmentados por dentro, mas por fora sao um controle da
     mesma altura dos botoes -- e' o que faz a linha 2 parecer uma linha. */
  .tools-group, .zoom-group, #var-search-wrap {
    height: var(--ctl-h); box-sizing: border-box;
  }
  .tools-group .tool-label, .zoom-group .tool-label,
  .tool-btn, .zoom-btn, #var-search-wrap .vs-btn, #var-search {
    height: 100%; box-sizing: border-box;
  }
  /* Estado da leitura: uma pastilha, nao um texto solto ao lado do titulo.
     A mensagem de erro do rele pode ser longa -- e' cortada com reticencias e
     o texto inteiro fica no `title` (o JS copia os dois juntos). */
  .status {
    /* inline-block, e nao flex: `text-overflow` so corta com reticencias em
       caixa de bloco -- num container flex o texto vira item anonimo e a
       mensagem sairia cortada a seco. A altura casa com a dos controles pela
       line-height. */
    display: inline-block; height: var(--ctl-h); box-sizing: border-box;
    line-height: calc(var(--ctl-h) - 2px); padding: 0 var(--s2);
    font: 400 11px/1 var(--mono); color: var(--ok);
    background: var(--surface-2); border: 1px solid var(--border-ctl);
    border-radius: var(--radius);
    max-width: 52ch; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; flex: 0 1 auto;
  }
  .status.stale { color: var(--warn); border-color: var(--warn); }
  .status.error { color: var(--err); border-color: var(--err); }
  /* So' aparece em diagramas MMS -- o telnet nao tem a garantia de ritmo que
     torna este controle seguro (ver diagram.py:set_interval_ms), entao o
     campo nem existe pra nao sugerir que existe. */
  .poll-ctl {
    display: inline-flex; align-items: center; gap: var(--s1);
    height: var(--ctl-h); box-sizing: border-box; padding: 0 var(--s2);
    background: var(--surface-2); color: var(--text-2);
    border: 1px solid var(--border-ctl); border-radius: var(--radius);
    font: 400 11px/1 var(--sans); white-space: nowrap;
  }
  /* Precisa ganhar do `display: inline-flex` de cima -- mesma especificidade
     de [hidden], mas autor sempre ganha da folha UA, entao sem isto o campo
     de periodo ficava visivel em diagramas telnet mesmo com o atributo
     `hidden` presente (visto na verificacao manual: computed display ficava
     "flex" com hidden="" no elemento). */
  .poll-ctl[hidden] { display: none; }
  .poll-ctl label { color: var(--text-2); }
  .poll-ctl input {
    /* Cabe 6 digitos com o padding e as bordas dentro da conta (o `width` e' a
       caixa INTEIRA, por causa do box-sizing: border-box do shell). Era
       `width: 6ch` liso, e cortava ate' o proprio valor padrao: medido no
       navegador, "100" pedia 41px numa caixa de 38px, e "10000" pedia 54px.
       Boa parte disso eram as SETAS do type=number, que o Chrome desenha
       DENTRO da caixa de conteudo e por cima do texto; elas saem aqui -- o
       campo e' de digitar, e o `min` do input ja' barra o valor negativo,
       que e' o unico valor que o servidor corrige. */
    width: calc(6ch + 2 * 4px + 2px);
    appearance: textfield; -moz-appearance: textfield;
    font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--border-ctl); border-radius: var(--radius);
    padding: 0 4px; box-sizing: border-box; height: calc(var(--ctl-h) - 8px);
  }
  .poll-ctl input::-webkit-outer-spin-button,
  .poll-ctl input::-webkit-inner-spin-button { appearance: none; margin: 0; }
  .poll-status { font-family: var(--mono); color: var(--text-2); }
  #pages { grid-area: pages; display: flex; flex-wrap: wrap; gap: 4px; padding: var(--s1); background: var(--surface-2); }
  #pages button {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border-ctl);
    padding: var(--s1) var(--s2); font-size: 11px; cursor: pointer; border-radius: var(--radius);
  }
  #pages button:hover { background: var(--surface-3); }
  #pages button.active { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--accent-fg); }
  /* O leito e' do tema; o DESENHO nao muda -- continua branco, com moldura,
     como nas tres direcoes dos mockups. As classes de estado ao vivo
     (bit-1/bit-0/bit-unknown, connection) ficam como estao, mais abaixo. */
  #viewer {
    grid-area: viewer;
    padding: var(--s3); background: var(--viewer-bg); min-height: 400px;
    overflow: auto;
    --gle-zoom: 1;
  }
  #viewer svg { background: #fefefe; border: 1px solid var(--border); }
  /* Zoom: a largura do SVG e uma % do container multiplicada pelo fator.
     zoom 1 = ajustado a largura; acima disso o proprio #viewer (overflow:auto)
     vira a area de scroll/pan. height:auto preserva a proporcao. */
  #viewer svg {
    width: calc(100% * var(--gle-zoom)); height: auto;
    display: block; margin: 0 auto;   /* centraliza quando sobra largura */
  }
  body.panning #viewer { cursor: grabbing; user-select: none; -webkit-user-select: none; }
  /* 3 estados visualmente distintos: ON (verde), OFF (cinza claro), DESCONHECIDO (amarelo hachurado) */
  #viewer svg .element-symbol.bit-1 { fill: #6fdc6f !important; stroke: #1a6a1a !important; stroke-width: 1.5 !important; }
  #viewer svg .element-symbol.bit-0 { fill: #e8e8e8 !important; stroke: #888 !important; }
  #viewer svg .element-symbol.bit-unknown { fill: #fff4c8 !important; stroke: #d49a00 !important; stroke-dasharray: 2,2; }
  /* Mesmas regras para blocos de logica (AND/OR/PLT/TIMER/AST) que tem valor avaliado */
  #viewer svg .gate-grp rect.bit-1 { fill: #6fdc6f !important; stroke: #1a6a1a !important; stroke-width: 1.5 !important; }
  #viewer svg .gate-grp rect.bit-0 { fill: #e8e8e8 !important; stroke: #666 !important; }
  #viewer svg .gate-grp rect.bit-unknown { fill: #fff4c8 !important; stroke: #d49a00 !important; stroke-dasharray: 2,2; }
  #viewer svg polyline.connection.unknown { stroke: #d49a00; stroke-width: 0.8; stroke-dasharray: 3,2; }
  #viewer svg polyline.connection.off { stroke: #404040; stroke-width: 0.6; }
  #values-panel {
    grid-area: panel;
    overflow-y: auto;
    background: var(--surface); border-left: 1px solid var(--border-ctl); padding: var(--s2);
    font-family: var(--mono); font-size: 11px;
  }
  #values-panel h3 { margin: 0 0 6px 0; font-size: 12px; color: var(--accent); }
  #values-panel section + section { margin-top: 12px; }
  .legend-row { display: flex; align-items: center; gap: 6px; line-height: 1.6; font-size: 10px; }
  .legend-swatch { display: inline-block; width: 14px; height: 10px; flex: 0 0 14px; }
  /* Conectores da pagina: nome, estado e a equacao que o aciona. */
  .conn-item { margin-bottom: 8px; }
  .conn-item + .conn-item { border-top: 1px solid var(--border); padding-top: 6px; }
  .conn-head { display: flex; align-items: center; gap: 6px; font-size: 11px; }
  .conn-name { font-weight: 600; }
  .conn-where { color: var(--muted); font-size: 10px; }
  /* A equacao quebra linha: 107 caracteres e' a mediana medida no corpus, e
     o painel e' estreito. `pre-wrap` mantem os espacos que separam os
     operadores. */
  .conn-eq {
    font-family: var(--mono); font-size: 10px; line-height: 1.5;
    white-space: pre-wrap; word-break: break-word; margin-top: 3px;
  }
  /* As mesmas tres cores da legenda -- e' o mesmo estado, e uma quarta
     paleta so' faria a pessoa traduzir de cabeca. */
  .conn-var { padding: 0 2px; border-radius: 2px; }
  .conn-var.bit-1 { background: #6fdc6f; border: 1px solid #1a6a1a; }
  .conn-var.bit-0 { background: #e8e8e8; border: 1px solid #888; }
  .conn-var.bit-unknown { background: #fff4c8; border: 1px dashed #d49a00; }
  /* "Fora do modelo" -- o painel das variaveis que esta conexao nao le. */
  #unreachable > summary {
    cursor: pointer; font-size: 12px; color: var(--accent);
    list-style: none; display: flex; align-items: center; gap: 6px;
  }
  #unreachable > summary::-webkit-details-marker { display: none; }
  #unreachable > summary::before { content: '\25B8'; font-size: 9px; color: var(--text-3); }
  #unreachable[open] > summary::before { content: '\25BE'; }
  .uc-count {
    font-size: 10px; padding: 0 4px; border-radius: var(--radius);
    border: 1px solid var(--missing); background: var(--tint-missing);
    color: var(--missing);
  }
  .uc-count[data-state="none"] {
    border-color: var(--ok); background: var(--tint-ok); color: var(--ok);
  }
  .uc-count[data-state="unknown"] {
    border-color: var(--border-ctl); background: none; color: var(--text-3);
  }
  .uc-hint { font-size: 10px; color: var(--text-2); line-height: 1.4; margin: 6px 0; }
  .uc-actions { display: flex; gap: 4px; margin-bottom: 6px; }
  .uc-btn {
    font-family: var(--mono); font-size: 10px; cursor: pointer;
    text-decoration: none; padding: 2px 6px; border-radius: var(--radius);
    border: 1px solid var(--border-ctl); background: var(--surface-2);
    color: var(--text);
  }
  .uc-btn[aria-disabled="true"] { opacity: 0.45; pointer-events: none; }
  .uc-list { font-size: 10px; max-height: 30vh; overflow-y: auto; }
  .uc-list div { color: var(--missing); }
  .v-active { color: var(--ok); }
  .v-inactive { color: var(--text-2); }
  .an-group { margin-bottom: 8px; }
  .an-group-hdr {
    color: var(--warn); font-size: 10px; font-weight: bold;
    border-bottom: 1px dotted var(--border); padding-bottom: 2px; margin-bottom: 3px;
  }
  .an-row { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; }
  .an-row .an-name { color: var(--text); }
  .an-row .an-val  { color: var(--text); font-variant-numeric: tabular-nums; }
  .an-row.na .an-val { color: var(--text-2); font-style: italic; }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-areas: "header" "tabs" "pages" "viewer" "panel"; }
    body.panel-collapsed { grid-template-columns: 1fr; }
    #values-panel { border-left: none; border-top: 1px solid var(--border-ctl); max-height: 40vh; }
  }

  /* Tools group no header (Mouse / Highlighter) */
  .tools-group {
    display: inline-flex; align-items: center; gap: 0;
    border: 1px solid var(--border-ctl); border-radius: var(--radius); overflow: hidden;
  }
  .tools-group .tool-label {
    background: var(--surface); color: var(--text-2); font-size: 10px;
    padding: var(--s1) var(--s1); border-right: 1px solid var(--border-ctl);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .tool-btn {
    background: var(--surface-2); color: var(--text); border: none;
    padding: var(--s1) var(--s2); font-size: 11px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 4px;
    border-left: 1px solid var(--border);
  }
  .tool-btn:first-of-type { border-left: none; }
  .tool-btn:hover { background: var(--surface-3); }
  .tool-btn.active {
    background: #c79a00; color: #1a1a1a;
  }
  .tool-btn .tool-icon { width: 14px; height: 14px; display: inline-block; }
  /* Grupo de zoom no header (mesma pegada visual do .tools-group) */
  .zoom-group {
    display: inline-flex; align-items: center; gap: 0;
    border: 1px solid var(--border-ctl); border-radius: var(--radius); overflow: hidden;
  }
  .zoom-group .tool-label {
    background: var(--surface); color: var(--text-2); font-size: 10px;
    padding: var(--s1) var(--s1); border-right: 1px solid var(--border-ctl);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .zoom-btn {
    background: var(--surface-2); color: var(--text); border: none;
    padding: var(--s1) var(--s2); font-size: 11px; cursor: pointer;
    border-left: 1px solid var(--border); line-height: 1.2;
  }
  .zoom-btn:hover { background: var(--surface-3); }
  .zoom-btn:disabled { color: var(--text-3); cursor: default; background: var(--surface-2); }
  #zoom-level {
    min-width: 46px; font-family: var(--mono); font-variant-numeric: tabular-nums;
  }
  .zoom-btn.active { background: var(--accent-strong); color: var(--accent-fg); }

  body.tool-highlight #viewer { cursor: crosshair; }
  body.tool-highlight #viewer svg .symbol-grp,
  body.tool-highlight #viewer svg .gate-grp,
  body.tool-highlight #viewer svg polyline.connection {
    cursor: crosshair;
  }

  /* Visual do marcador de texto -- overlay flat amarelo (mais escuro/saturado) */
  #viewer svg .hl-overlay {
    fill: #f0b800; fill-opacity: 0.7; stroke: none; pointer-events: none;
  }
  #viewer svg polyline.hl-line-overlay {
    fill: none; stroke: #f0b800; stroke-opacity: 0.78;
    stroke-width: 5; stroke-linecap: round; stroke-linejoin: round;
    pointer-events: none;
  }
  /* Rubber-band do drag-select em modo highlight */
  #viewer svg .rubber-band {
    fill: #f0b800; fill-opacity: 0.10;
    stroke: #c79a00; stroke-width: 0.8; stroke-dasharray: 4,2;
    pointer-events: none;
  }
  body.tool-highlight #viewer { user-select: none; -webkit-user-select: none; }

  /* Notepad: painel fixo deslizante a partir da direita */
  #notes-panel {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: 380px; max-width: 90vw;
    background: var(--surface);
    border-left: 1px solid var(--border-ctl);
    box-shadow: -4px 0 12px rgba(0,0,0,0.4);
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.22s ease;
    z-index: 50;
  }
  body.notes-open #notes-panel { transform: translateX(0); }
  #notes-header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; background: var(--surface-2); border-bottom: 1px solid var(--border-ctl);
    font-size: 12px;
  }
  #notes-header strong { font-size: 12px; color: var(--text); }
  #notes-header .spacer { flex: 1; }
  #notes-status { font-size: 10px; color: var(--ok); font-family: var(--mono); }
  #notes-status.saving { color: var(--warn); }
  #notes-status.error { color: var(--err); }
  #notes-close {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    padding: 2px 8px; font-size: 11px; cursor: pointer; border-radius: var(--radius);
  }
  #notes-close:hover { background: var(--border-ctl); }
  #notes-toolbar {
    display: flex; flex-wrap: wrap; gap: 3px;
    padding: var(--s1); background: var(--surface-2); border-bottom: 1px solid var(--border-ctl);
  }
  #notes-toolbar button {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    padding: var(--s1) var(--s1); font-size: 11px; font-family: inherit;
    cursor: pointer; border-radius: var(--radius); min-width: 26px;
  }
  #notes-toolbar button:hover { background: var(--border-ctl); }
  #notes-toolbar button.tb-b { font-weight: bold; }
  #notes-toolbar button.tb-i { font-style: italic; }
  #notes-toolbar button.tb-u { text-decoration: underline; }
  #notes-toolbar .tb-sep {
    width: 1px; background: var(--border); margin: 2px 3px;
  }
  #notes-editor {
    flex: 1; overflow-y: auto;
    padding: 12px; background: #fdfdf7; color: #222;
    font-family: -apple-system, system-ui, sans-serif; font-size: 13px;
    line-height: 1.45; outline: none;
  }
  #notes-editor:focus { background: #fff; }
  #notes-editor h1 { font-size: 18px; margin: 8px 0 4px; }
  #notes-editor h2 { font-size: 15px; margin: 6px 0 3px; }
  #notes-editor p  { margin: 4px 0; }
  #notes-editor ul, #notes-editor ol { margin: 4px 0 4px 22px; }
  #notes-editor blockquote {
    border-left: 3px solid #ccc; margin: 6px 0; padding: 2px 8px; color: #555;
  }
  #notes-editor code {
    background: #eef0f4; padding: 1px 4px; border-radius: 3px;
    font-family: monospace; font-size: 12px;
  }
  /* Abas de escopo da nota (Rele / Pagina atual) */
  #notes-tabs {
    display: flex; gap: 0; background: var(--surface-2);
    border-bottom: 1px solid var(--border-ctl);
  }
  .notes-tab {
    flex: 1; background: transparent; color: var(--text-2); border: none;
    border-right: 1px solid var(--surface-2); border-bottom: 2px solid transparent;
    padding: var(--s1) var(--s2); font-size: 11px; cursor: pointer;
    font-family: inherit;
    text-align: left; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
  }
  .notes-tab:last-child { border-right: none; }
  .notes-tab:hover { background: var(--surface-2); color: var(--text); }
  .notes-tab.active {
    background: var(--surface-2); color: var(--text);
    border-bottom-color: #c79a00;
  }
  .notes-tab .tab-scope { font-size: 9px; color: #777; text-transform: uppercase; letter-spacing: 0.05em; }
  .notes-tab.active .tab-scope { color: #c79a00; }
  .notes-tab .tab-name { font-weight: 500; }
  .notes-tab .has-note-dot {
    display: inline-block; width: 6px; height: 6px;
    border-radius: 50%; background: #c79a00;
    margin-left: 2px; visibility: hidden;
  }
  .notes-tab.has-note .has-note-dot { visibility: visible; }
  /* Indicador no botao da pagina (nav superior) */
  #pages button.has-note::after {
    content: ''; display: inline-block;
    width: 5px; height: 5px; border-radius: 50%;
    background: #c79a00; margin-left: 5px; vertical-align: middle;
  }
  /* Indicador de match da busca: dot ciano a esquerda do nome (nao colide
     com o dot amarelo de notas, que fica a direita via ::after). */
  #pages button.has-search-hit {
    border-color: #2bb6ff;
  }
  #pages button.has-search-hit::before {
    content: ''; display: inline-block;
    width: 5px; height: 5px; border-radius: 50%;
    background: #2bb6ff; margin-right: 5px; vertical-align: middle;
  }
  #pages button.active.has-search-hit {
    /* mantem o azul do search-hit por cima do estilo .active */
    border-color: #2bb6ff;
  }
  /* Search box: localizar variavel no diagrama */
  #var-search-wrap {
    position: relative;
    display: inline-flex; align-items: center; gap: 0;
    border: 1px solid var(--border-ctl); border-radius: var(--radius); background: var(--surface-2);
  }
  #var-search {
    background: transparent; color: var(--text); border: none; outline: none;
    padding: var(--s1) var(--s2); font-size: 11px; font-family: var(--mono);
    width: 230px;
  }
  #var-search::placeholder { color: var(--text-3); }
  #var-search-wrap .vs-count {
    font-size: 10px; color: var(--text-2); padding: 0 8px;
    border-left: 1px solid var(--border); font-variant-numeric: tabular-nums;
    min-width: 40px; text-align: center;
  }
  #var-search-wrap .vs-count.has-hits { color: var(--ok); }
  #var-search-wrap .vs-count.no-hits  { color: var(--err); }
  #var-search-wrap .vs-btn {
    background: transparent; color: var(--text); border: none; cursor: pointer;
    padding: 4px 6px; font-size: 11px; line-height: 1;
    border-left: 1px solid var(--border);
  }
  #var-search-wrap .vs-btn:hover { background: var(--surface-3); color: var(--text); }
  #var-search-wrap .vs-btn:disabled { color: var(--border); cursor: default; background: transparent; }
  /* Dropdown de paginas com matches (mostrado quando ha resultados off-page) */
  #var-search-dropdown {
    position: absolute; top: 100%; left: 0; right: 0;
    margin-top: 2px; background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    z-index: 60; max-height: 60vh; overflow-y: auto;
    display: none; min-width: 280px;
  }
  #var-search-dropdown.open { display: block; }
  #var-search-dropdown .vs-section {
    font-size: 9px; color: var(--text-2); text-transform: uppercase; letter-spacing: 0.05em;
    padding: 6px 10px 2px; border-top: 1px solid var(--surface-2);
  }
  #var-search-dropdown .vs-section:first-child { border-top: none; }
  #var-search-dropdown .vs-row {
    display: flex; gap: 8px; align-items: baseline;
    padding: var(--s1) var(--s2); cursor: pointer;
    font-family: var(--mono); font-size: 11px;
  }
  #var-search-dropdown .vs-row:hover,
  #var-search-dropdown .vs-row.kbd-focus { background: var(--surface-2); }
  #var-search-dropdown .vs-row .vs-name { color: var(--text); flex: 0 0 auto; }
  #var-search-dropdown .vs-row .vs-page { color: var(--accent); flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #var-search-dropdown .vs-row .vs-tag {
    font-size: 9px; color: var(--text-2); background: var(--surface-2); padding: 1px 5px;
    border-radius: var(--radius); text-transform: uppercase;
  }
  #var-search-dropdown .vs-row .vs-tag.tag-analog { background: var(--tint-equiv); color: var(--warn); }
  #var-search-dropdown .vs-row .vs-tag.tag-bit    { background: var(--tint-ok); color: var(--ok); }
  #var-search-dropdown .vs-empty {
    padding: var(--s2); color: var(--text-2); font-size: 11px; text-align: center; font-style: italic;
  }

  /* Overlay azul-ciano nos matches (distinto do amarelo do Marcador) */
  #viewer svg .search-hit {
    fill: #2bb6ff; fill-opacity: 0.45; stroke: #0078c8; stroke-width: 0.6;
    pointer-events: none;
  }
  #viewer svg .search-hit.current {
    fill-opacity: 0.7; stroke: #ff7a00; stroke-width: 1.6;
  }
  #viewer svg polyline.search-hit-line {
    fill: none; stroke: #2bb6ff; stroke-opacity: 0.6; stroke-width: 4;
    stroke-linecap: round; pointer-events: none;
  }
</style>
</head>
<body>
<header>
  <!-- Linha 1 -- identidade e estado: qual rele, qual GLE, como esta a leitura
       e os botoes que mexem nisso. -->
  <div class="hdr-row hdr-row-1">
    <div class="hdr-id">
      <span class="eyebrow">IED</span>
      <h1 id="relay-title">Graphical Logic Viewer</h1>
      <span class="gle" id="gle-name" hidden></span>
    </div>
    <span id="status" class="status">conectando...</span>
    <span class="poll-ctl" id="poll-ctl" hidden>
      <label for="poll-ms">Período</label>
      <!-- min="0": nao ha piso de periodo no MMS. 0 quer dizer "tao rapido
           quanto o rele responder" -- o laco le em lote, uma leitura por
           volta, e nunca parte a proxima antes da resposta da anterior (ver
           transport/mms.py:effective_interval). -->
      <input type="number" id="poll-ms" min="0" step="10" value="100"> ms
      <span id="poll-status" class="poll-status"></span>
    </span>
    <span class="spacer"></span>
    <button id="conn-toggle" class="hbtn" type="button" data-state="idle"
            title="Conectar ou desconectar este diagrama">Conectar</button>
    <button id="notes-toggle" class="hbtn" type="button" aria-controls="notes-panel" aria-expanded="false">Notas</button>
    <button id="panel-toggle" class="hbtn" type="button" aria-controls="values-panel" aria-expanded="true">Ocultar painel</button>
    <a id="back-to-home" class="hbtn" href="/" title="Voltar ao menu de ferramentas">&#x2190; Menu</a>
  </div>
  <!-- Linha 2 -- o que se faz com o desenho: localizar, marcar, ampliar. -->
  <div class="hdr-row hdr-row-2">
    <div id="var-search-wrap" role="search" title="Localizar variável (atalho: /)">
      <input id="var-search" type="search" autocomplete="off" spellcheck="false"
             placeholder="Localizar variável (tecla /)" aria-label="Localizar variável">
      <span class="vs-count" id="var-search-count" aria-live="polite">-</span>
      <button class="vs-btn" id="var-search-prev" type="button"
              title="Anterior (Shift+Enter)" aria-label="Anterior" disabled>&#x25B2;</button>
      <button class="vs-btn" id="var-search-next" type="button"
              title="Próximo (Enter)" aria-label="Próximo" disabled>&#x25BC;</button>
      <button class="vs-btn" id="var-search-clear" type="button"
              title="Limpar (Esc)" aria-label="Limpar">&times;</button>
      <div id="var-search-dropdown" role="listbox" aria-label="Resultados"></div>
    </div>
    <span class="spacer"></span>
    <div class="tools-group" role="radiogroup" aria-label="Ferramentas">
      <span class="tool-label">Ferramentas</span>
      <button id="tool-select" class="tool-btn active" type="button" role="radio" aria-checked="true" data-tool="select" title="Selecionar">
        <svg class="tool-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M3 1 L13 9 L8.5 9.5 L11 14.5 L9 15.5 L6.5 10.5 L3 13 Z"/></svg>
        <span>Mouse</span>
      </button>
      <button id="tool-highlight" class="tool-btn" type="button" role="radio" aria-checked="false" data-tool="highlight" title="Marcador de texto">
        <svg class="tool-icon" viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M11 1.5 L14.5 5 L8 11.5 L4.5 12.5 L3.5 13.5 L2.5 12.5 L3.5 11.5 L4.5 8 Z M9 3.5 L12.5 7"/></svg>
        <span>Marcador</span>
      </button>
    </div>
    <div class="zoom-group" aria-label="Zoom do diagrama">
      <span class="tool-label">Zoom</span>
      <button id="zoom-out" class="zoom-btn" type="button"
              title="Reduzir (tecla -)" aria-label="Reduzir">&minus;</button>
      <button id="zoom-level" class="zoom-btn" type="button"
              title="Ajustar página inteira a tela (tecla 0)" aria-label="Ajustar a tela">100%</button>
      <button id="zoom-in" class="zoom-btn" type="button"
              title="Ampliar (tecla +)" aria-label="Ampliar">+</button>
      <button id="zoom-fit-width" class="zoom-btn" type="button"
              title="Ajustar a largura (tecla 9)" aria-label="Ajustar a largura">&#x2194;</button>
      <button id="zoom-fit-page" class="zoom-btn" type="button"
              title="Página inteira na tela (tecla 0)" aria-label="Página inteira">&#x26F6;</button>
    </div>
  </div>
</header>
<nav id="tabs" aria-label="Diagramas abertos"></nav>
<nav id="pages"></nav>
<main id="viewer"></main>
<aside id="values-panel">
  <section>
    <h3>Legenda</h3>
    <div class="legend-row"><span class="legend-swatch" style="background:#6fdc6f; border:1px solid #1a6a1a"></span> Ativo (1)</div>
    <div class="legend-row"><span class="legend-swatch" style="background:#e8e8e8; border:1px solid #888"></span> Inativo (0)</div>
    <div class="legend-row"><span class="legend-swatch" style="background:#fff4c8; border:1px dashed #d49a00"></span> Indeterminado</div>
  </section>
  <section id="connectors-section" hidden>
    <!-- Conectores da PAGINA ABERTA. Um conector nao e' uma linha: e' um nome
         que duas ou mais pontas compartilham, e a equacao que o aciona pode
         estar em outra pagina. Mostrar a equacao com as variaveis coloridas
         e' o que deixa a pessoa ver POR QUE o conector esta como esta sem
         precisar trocar de pagina. -->
    <h3>Conectores</h3>
    <div id="connectors-list"></div>
  </section>
  <section>
    <!-- O que a conexão escolhida NAO alcança. Fechado por padrão: num
         desenho bem coberto e' uma lista vazia, e ela nao pode disputar
         espaco com os valores que estao sendo lidos. -->
    <details id="unreachable">
      <summary>Fora do modelo <span class="uc-count" id="unreachable-count"
                                    data-state="unknown">&mdash;</span></summary>
      <div class="uc-hint" id="unreachable-hint"></div>
      <div class="uc-actions">
        <button type="button" class="uc-btn" id="unreachable-copy"
                title="Copiar os nomes, um por linha">Copiar</button>
        <a class="uc-btn" id="unreachable-txt" href="#" download
           title="Baixar a lista como .txt">Baixar .txt</a>
      </div>
      <div class="uc-list" id="unreachable-list"></div>
    </details>
  </section>
  <section>
    <h3>Bits na página</h3>
    <div id="bit-counts" style="font-size:10px"></div>
  </section>
  <section>
    <h3>Bits ativos</h3>
    <div id="active-bits">aguardando...</div>
  </section>
  <section>
    <h3>Bits indeterminados</h3>
    <div id="unknown-bits" style="font-size:10px"></div>
  </section>
  <section>
    <h3>Analógicos</h3>
    <div id="analog-values">-</div>
  </section>
</aside>

<aside id="notes-panel" aria-hidden="true">
  <div id="notes-header">
    <strong>Bloco de notas</strong>
    <span id="notes-status">-</span>
    <span class="spacer"></span>
    <button id="notes-close" type="button" title="Fechar">x</button>
  </div>
  <div id="notes-tabs" role="tablist">
    <button class="notes-tab active" type="button" role="tab"
            data-scope="relay" aria-selected="true">
      <span><span class="tab-scope">Relé</span> <span class="tab-name">Geral</span></span>
      <span class="has-note-dot" aria-hidden="true"></span>
    </button>
    <button class="notes-tab" type="button" role="tab"
            data-scope="page" aria-selected="false">
      <span><span class="tab-scope">Página</span> <span class="tab-name" id="notes-page-name">-</span></span>
      <span class="has-note-dot" aria-hidden="true"></span>
    </button>
  </div>
  <div id="notes-toolbar">
    <button type="button" class="tb-b" data-cmd="bold" title="Negrito (Ctrl+B)">B</button>
    <button type="button" class="tb-i" data-cmd="italic" title="Italico (Ctrl+I)">I</button>
    <button type="button" class="tb-u" data-cmd="underline" title="Sublinhado (Ctrl+U)">U</button>
    <button type="button" data-cmd="strikeThrough" title="Tachado">S</button>
    <span class="tb-sep"></span>
    <button type="button" data-cmd="formatBlock" data-arg="H1" title="Titulo 1">H1</button>
    <button type="button" data-cmd="formatBlock" data-arg="H2" title="Titulo 2">H2</button>
    <button type="button" data-cmd="formatBlock" data-arg="P" title="Paragrafo">P</button>
    <span class="tb-sep"></span>
    <button type="button" data-cmd="insertUnorderedList" title="Lista">&bull; Lista</button>
    <button type="button" data-cmd="insertOrderedList" title="Lista numerada">1. Lista</button>
    <button type="button" data-cmd="formatBlock" data-arg="BLOCKQUOTE" title="Citacao">"</button>
    <button type="button" data-cmd="formatBlock" data-arg="PRE" title="C&oacute;digo">&lt;/&gt;</button>
    <span class="tb-sep"></span>
    <button type="button" data-cmd="removeFormat" title="Limpar formatacao">Tx</button>
  </div>
  <div id="notes-editor" contenteditable="true" spellcheck="false"></div>
</aside>

<script>
// Estado de arranque: as abas abertas e qual esta ativa. O resto (paginas,
// indice de variaveis, familias de analogicos) vem de /meta?d= a cada troca
// de aba -- por isso nada aqui e' const.
const BOOT = ${BOOT_JSON};
let TABS = BOOT.diagrams || [];
let activeDiagram = BOOT.active || (TABS[0] && TABS[0].id) || null;
let PAGES = [];        // [[nome, safe_id], ...] do diagrama ativo
let VAR_INDEX = {};    // {NAME_UPPER: {kind:'bit'|'analog', pages:[safe,...]}}
let currentPage = "";

// Toda rota do GLV e' por diagrama: sem `d` o servidor usaria o ativo dele,
// que pode nao ser o que esta na tela desta aba do navegador.
function withD(url) {
  if (!activeDiagram) return url;
  return url + (url.indexOf('?') >= 0 ? '&' : '?') + 'd=' + encodeURIComponent(activeDiagram);
}
let lastValues = { digitals: {}, analogs: {}, ts: 0, error: "" };
let varSearch = null;  // exposto pra loadPage() re-aplicar busca após troca de página
let zoomCtl = null;    // exposto pra loadPage() reajustar o zoom na nova página

// Controle de período: so' existe pro modo MMS (ver diagram.py:set_interval_ms
// -- telnet nao tem piso proprio pra isto mexer). `activeScanMode` vem de
// meta() a cada troca de diagrama; `periodNotice` guarda o "adiado"/"recusado"
// da ultima resposta de /period ate' a proxima troca, porque um pedido adiado
// continua valendo mesmo depois que o proximo poll de /values sobrescreveria
// um texto solto.
let activeScanMode = 'telnet';
let periodNotice = null;
const pollCtl = document.getElementById('poll-ctl');
const pollMs = document.getElementById('poll-ms');
const pollStatus = document.getElementById('poll-status');

(function setupPanelToggle() {
  const btn = document.getElementById('panel-toggle');
  if (!btn) return;
  const KEY = 'sel411-panel-collapsed';
  function apply(collapsed) {
    document.body.classList.toggle('panel-collapsed', collapsed);
    btn.textContent = collapsed ? 'Mostrar painel' : 'Ocultar painel';
    btn.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
  }
  try { apply(localStorage.getItem(KEY) === '1'); } catch (e) { apply(false); }
  btn.addEventListener('click', () => {
    const next = !document.body.classList.contains('panel-collapsed');
    apply(next);
    try { localStorage.setItem(KEY, next ? '1' : '0'); } catch (e) {}
  });
})();

// Cache do SVG por pagina, no cliente. `/pages/<id>` devolve sempre os mesmos
// bytes -- o servidor renderiza todas as paginas quando o diagrama abre e
// guarda as strings prontas -- entao ir e voltar entre duas paginas baixava e
// RE-PARSEAVA ~48 kB de SVG a cada troca. Guardamos o no ja' parseado: voltar
// a uma pagina ja' vista e' um `replaceChildren`, sem rede e sem parse.
//
// O GET continua acontecendo, agora com `have=1`. `/pages/<id>` e' o UNICO
// caminho pelo qual o servidor descobre que pagina o visitante abriu
// (`GlvDiagram.remember_page`, que e' o que faz a aba lembrar onde estava), e
// essa invariante nao pode depender de o cliente ter ou nao os bytes. Com
// `have=1` a resposta e' 204 sem corpo, e ninguem espera por ela.
const PAGE_CACHE_MAX = 12;
const pageSvgCache = new Map();

async function loadPage(safeId, name) {
  const viewer = document.getElementById('viewer');
  const key = `${activeDiagram}|${safeId}`;
  let node = pageSvgCache.get(key);
  if (node) {
    pageSvgCache.delete(key);            // reordena o LRU
    pageSvgCache.set(key, node);
    fetch(withD(`/pages/${safeId}?have=1`)).catch(() => {});
    // Um no que volta do cache traz os overlays que tinha quando saiu.
    // `applyHighlightsForCurrentPage` so' ADICIONA (e cada `apply*Highlight`
    // se protege de duplicar), entao um marcador apagado enquanto a pagina
    // estava fora ficaria na tela para sempre. Zerar aqui e deixar o reapply
    // reconstruir e' o que mantem o desenho igual ao estado do servidor.
    node.querySelectorAll('.hl-overlay, .hl-line-overlay, .search-hit, .search-hit-line')
        .forEach(n => n.remove());
    node.querySelectorAll('.highlighted').forEach(n => n.classList.remove('highlighted'));
  } else {
    const r = await fetch(withD(`/pages/${safeId}`));
    const text = await r.text();
    const holder = document.createElement('div');
    holder.innerHTML = text;
    node = holder.querySelector('svg');
    if (node) {
      pageSvgCache.set(key, node);
      // LRU curto: 42 paginas de um GLE grande sao ~2 MB de SVG parseado, e
      // ninguem navega entre doze paginas ao mesmo tempo.
      while (pageSvgCache.size > PAGE_CACHE_MAX) {
        pageSvgCache.delete(pageSvgCache.keys().next().value);
      }
    }
  }
  if (node) viewer.replaceChildren(node);
  else viewer.innerHTML = '';
  if (zoomCtl) zoomCtl.onPageChange();
  document.querySelectorAll('#pages button').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`#pages button[data-page="${safeId}"]`);
  if (btn) btn.classList.add('active');
  currentPage = safeId;
  // O stream segue a PAGINA: `/events` filtra pelos bits dela, como `/values`.
  startStream();
  applyValues(lastValues);
  applyGroupState();
  applyHighlightsForCurrentPage();
  if (notesCtl) notesCtl.onPageChange(safeId);
  if (varSearch) varSearch.reapply();
}

// =============================================================================
// Busca de variaveis no diagrama (header > #var-search-wrap)
// Match case-insensitive por substring contra VAR_INDEX (chaves UPPER).
// Pinta overlays cyan sobre matches da pagina atual; lista paginas com
// matches em outros lugares no dropdown (clicaveis -> loadPage).
// Enter avanca, Shift+Enter volta, Esc limpa. Tecla "/" foca o input.
// =============================================================================
(function setupVarSearch() {
  const input    = document.getElementById('var-search');
  const countEl  = document.getElementById('var-search-count');
  const btnPrev  = document.getElementById('var-search-prev');
  const btnNext  = document.getElementById('var-search-next');
  const btnClear = document.getElementById('var-search-clear');
  const dropdown = document.getElementById('var-search-dropdown');
  if (!input) return;

  // PAGES so' e' preenchido por applyMeta(), DEPOIS deste IIFE, e e' trocado
  // a cada aba de diagrama -- entao nada aqui pode virar snapshot: le-se
  // sempre a lista viva do diagrama ativo.
  // Mapa pageId -> nome legivel (pra dropdown)
  function pageName(safe) {
    for (const [name, s] of PAGES) if (s === safe) return name;
    return safe;
  }

  // Ordem global das paginas -- usada pra decidir qual e a "proxima pagina
  // com matches" na navegacao cross-page.
  function pageOrder() { return PAGES.map(([, safe]) => safe); }

  let lastQuery = '';
  let currentHits = [];   // [{el, name, kind}] sobre a página atual
  let currentIdx = -1;
  let debounceTimer = null;
  // Set ordenado (pela ordem de PAGES) das paginas que tem matches pra
  // query atual. Recalculado em todo run() a partir do VAR_INDEX.
  let pagesWithHits = [];
  // Sinaliza ao proximo run() pra focar o ULTIMO hit (em vez do primeiro)
  // -- usado quando o usuario navega "pra tras" cruzando paginas.
  let pendingFocus = null;  // 'first' | 'last' | null

  function clearHighlights() {
    document.querySelectorAll('#viewer svg .search-hit').forEach(n => n.remove());
    currentHits = [];
    currentIdx = -1;
  }

  // Pinta/desmarca o dot ciano nos botoes das paginas que tem matches.
  function clearTabHighlights() {
    document.querySelectorAll('#pages button.has-search-hit')
      .forEach(b => b.classList.remove('has-search-hit'));
  }
  function applyTabHighlights(pageSet) {
    document.querySelectorAll('#pages button').forEach(b => {
      const pg = b.getAttribute('data-page');
      b.classList.toggle('has-search-hit', pageSet.has(pg));
    });
  }

  function paintHit(blockEl) {
    // Caixa principal do bloco (mesma logica do hl-overlay amarelo)
    const rect = blockEl.querySelector('rect:not(.hl-overlay):not(.search-hit)');
    if (!rect) return null;
    const x = parseFloat(rect.getAttribute('x'));
    const y = parseFloat(rect.getAttribute('y'));
    const w = parseFloat(rect.getAttribute('width'));
    const h = parseFloat(rect.getAttribute('height'));
    if (![x, y, w, h].every(Number.isFinite)) return null;
    const pad = 3;
    const hl = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    hl.setAttribute('class', 'search-hit');
    hl.setAttribute('x', x - pad);
    hl.setAttribute('y', y - pad);
    hl.setAttribute('width', w + 2 * pad);
    hl.setAttribute('height', h + 2 * pad);
    hl.setAttribute('rx', '2.5');
    // Insere LOGO APOS o rect original: assim a cor tinge o fundo do bloco
    // (rect opaco coberto por overlay semi-transparente) mas o <text> com
    // o nome da variavel, que vem depois do rect no DOM, fica por cima.
    rect.insertAdjacentElement('afterend', hl);
    return hl;
  }

  function matchesQuery(name, q) {
    if (!q) return false;
    return name.toLowerCase().indexOf(q) !== -1;
  }

  // Acha matches na pagina atual usando os data-attrs do SVG (case-insensitive)
  function findCurrentPageHits(q) {
    const out = [];
    const svg = document.querySelector('#viewer svg');
    if (!svg || !q) return out;
    const blocks = svg.querySelectorAll('[data-bit], [data-analog], [data-output-bit], [data-const]');
    blocks.forEach(el => {
      const raw =
        el.getAttribute('data-bit') ||
        el.getAttribute('data-analog') ||
        el.getAttribute('data-output-bit') ||
        el.getAttribute('data-const') || '';
      if (matchesQuery(raw, q)) {
        let kind = 'bit';
        if (el.hasAttribute('data-analog')) kind = 'analog';
        else if (el.hasAttribute('data-output-bit')) kind = 'output';
        else if (el.hasAttribute('data-const')) kind = 'const';
        out.push({ el, name: raw, kind });
      }
    });
    return out;
  }

  // Walk no VAR_INDEX uma vez so. Retorna:
  //   pages  -> Set de safe_page_ids com qualquer match (inclui currentPage)
  //   others -> [{name, page, kind}] pro dropdown (exclui currentPage)
  function computeIndexMatches(q) {
    const out = { pages: new Set(), others: [] };
    if (!q) return out;
    for (const [name, ent] of Object.entries(VAR_INDEX)) {
      if (!matchesQuery(name, q)) continue;
      for (const pg of ent.pages) {
        out.pages.add(pg);
        if (pg !== currentPage) {
          out.others.push({ name, page: pg, kind: ent.kind });
        }
      }
    }
    out.others.sort((a, b) =>
      a.name.localeCompare(b.name) || a.page.localeCompare(b.page));
    return out;
  }

  // Lista ordenada (pela ordem de PAGES) das paginas que tem matches.
  // Usada pra calcular "proxima pagina" na navegacao com setas.
  function orderedPagesWithHits(pageSet) {
    return pageOrder().filter(safe => pageSet.has(safe));
  }

  function focusHit(i) {
    if (!currentHits.length) return;
    // Desmarca anterior
    currentHits.forEach(h => {
      const overlay = h.el.querySelector(':scope > .search-hit');
      if (overlay) overlay.classList.remove('current');
    });
    // Normaliza indice
    const n = currentHits.length;
    currentIdx = ((i % n) + n) % n;
    const target = currentHits[currentIdx];
    const overlay = target.el.querySelector(':scope > .search-hit');
    if (overlay) overlay.classList.add('current');
    // Centraliza no viewport (smooth)
    try {
      target.el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
    } catch (e) { /* navegador antigo */ }
    updateCounter();
  }

  function updateCounter() {
    const n = currentHits.length;
    const other = parseInt(countEl.dataset.other || '0', 10);
    const totalGlobal = n + other;
    if (!input.value.trim()) {
      countEl.textContent = '-';
      countEl.classList.remove('has-hits', 'no-hits');
      btnPrev.disabled = btnNext.disabled = true;
      return;
    }
    if (n === 0) {
      countEl.textContent = other > 0 ? `0 +${other}` : '0';
      countEl.classList.remove('has-hits');
      countEl.classList.toggle('no-hits', other === 0);
      // Enquanto houver QUALQUER match (mesmo em outra pagina), as setas
      // podem pular pra la -- entao mantemos prev/next habilitados.
      btnPrev.disabled = btnNext.disabled = (totalGlobal === 0);
      countEl.title = other > 0
        ? `Nenhum match na página atual; ${other} em outras páginas (setas pulam pra la)`
        : 'Nada encontrado';
      return;
    }
    const pos = currentIdx >= 0 ? (currentIdx + 1) : 1;
    countEl.textContent = other > 0 ? `${pos}/${n} +${other}` : `${pos}/${n}`;
    countEl.classList.add('has-hits');
    countEl.classList.remove('no-hits');
    // Habilitado se ha mais de 1 match global (entao setas podem avancar
    // pra dentro da pagina OU pular pra outra pagina).
    btnPrev.disabled = btnNext.disabled = (totalGlobal < 2);
    countEl.title = other > 0
      ? `${n} na página, ${other} em outras (setas atravessam páginas)`
      : `${n} match(es) na página`;
  }

  function renderDropdown(otherHits) {
    if (!otherHits.length) {
      // So mostra dropdown se nao tem nada na pagina atual tambem
      if (!currentHits.length && input.value.trim()) {
        dropdown.innerHTML = '<div class="vs-empty">Nada encontrado</div>';
        dropdown.classList.add('open');
      } else {
        dropdown.classList.remove('open');
        dropdown.innerHTML = '';
      }
      return;
    }
    const parts = [];
    parts.push(`<div class="vs-section">Outras páginas (${otherHits.length})</div>`);
    for (const row of otherHits.slice(0, 50)) {
      const pname = pageName(row.page);
      const tag = row.kind === 'analog' ? 'analog' : 'bit';
      parts.push(
        `<div class="vs-row" data-page="${row.page}" data-name="${row.name}">` +
          `<span class="vs-name">${escapeHtml(row.name)}</span>` +
          `<span class="vs-page">${escapeHtml(pname)}</span>` +
          `<span class="vs-tag tag-${tag}">${tag}</span>` +
        `</div>`
      );
    }
    if (otherHits.length > 50) {
      parts.push(`<div class="vs-empty">+${otherHits.length - 50} mais... refine a busca</div>`);
    }
    dropdown.innerHTML = parts.join('');
    dropdown.classList.add('open');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function run(opts) {
    opts = opts || {};
    const q = input.value.trim().toLowerCase();
    lastQuery = q;
    clearHighlights();
    if (!q) {
      countEl.dataset.other = '0';
      pagesWithHits = [];
      pendingFocus = null;
      clearTabHighlights();
      dropdown.classList.remove('open');
      updateCounter();
      return;
    }
    // Walk no VAR_INDEX uma vez so (rows pro dropdown + paginas com hits)
    const idx = computeIndexMatches(q);
    pagesWithHits = orderedPagesWithHits(idx.pages);
    applyTabHighlights(idx.pages);
    // Hits na pagina atual (pinta overlays cyan)
    const hits = findCurrentPageHits(q);
    hits.forEach(h => paintHit(h.el));
    currentHits = hits;
    countEl.dataset.other = String(idx.others.length);
    // Em reapply (apos troca de pagina disparada por click no dropdown ou
    // navegacao cross-page com setas), nao re-abre o dropdown -- o usuario
    // acabou de escolher onde ir.
    if (opts.suppressDropdown) {
      dropdown.classList.remove('open');
    } else {
      renderDropdown(idx.others);
    }
    if (currentHits.length) {
      // Decide indice inicial: 'last' quando viemos de Shift+Enter cruzando
      // paginas pra tras; 'first' (default) caso contrario.
      let initial = 0;
      if (pendingFocus === 'last') {
        initial = currentHits.length - 1;
      } else if (opts.preserveIdx && currentIdx >= 0) {
        initial = Math.min(currentIdx, currentHits.length - 1);
      }
      pendingFocus = null;
      focusHit(initial);
    } else {
      pendingFocus = null;
      updateCounter();
    }
  }

  // Pula pra uma pagina especifica e marca como deve focar o primeiro ou o
  // ultimo hit apos o re-paint. Usado pela navegacao cross-page.
  function jumpToPage(safe, focus) {
    pendingFocus = focus;     // 'first' | 'last'
    const name = pageName(safe);
    // loadPage e async (fetch + innerHTML + reapply); pendingFocus persiste
    // ate run() le-lo no proximo reapply.
    loadPage(safe, name);
  }

  // Proximo match na ordem global (avanca dentro da pagina, depois pula pra
  // proxima pagina com matches; faz wrap no fim).
  function goNext() {
    if (currentHits.length && currentIdx + 1 < currentHits.length) {
      focusHit(currentIdx + 1);
      return;
    }
    if (pagesWithHits.length === 0) return;
    if (pagesWithHits.length === 1 && pagesWithHits[0] === currentPage) {
      // So essa pagina tem matches -- wrap local pro inicio
      if (currentHits.length) focusHit(0);
      return;
    }
    const i = pagesWithHits.indexOf(currentPage);
    // Se a pagina atual nao tem matches (i === -1), comeca do indice 0;
    // senao avanca pra proxima, com wrap.
    const next = (i === -1)
      ? pagesWithHits[0]
      : pagesWithHits[(i + 1) % pagesWithHits.length];
    jumpToPage(next, 'first');
  }

  // Match anterior na ordem global (espelho de goNext).
  function goPrev() {
    if (currentHits.length && currentIdx > 0) {
      focusHit(currentIdx - 1);
      return;
    }
    if (pagesWithHits.length === 0) return;
    if (pagesWithHits.length === 1 && pagesWithHits[0] === currentPage) {
      if (currentHits.length) focusHit(currentHits.length - 1);
      return;
    }
    const i = pagesWithHits.indexOf(currentPage);
    const prev = (i === -1)
      ? pagesWithHits[pagesWithHits.length - 1]
      : pagesWithHits[(i - 1 + pagesWithHits.length) % pagesWithHits.length];
    jumpToPage(prev, 'last');
  }

  function scheduleRun() {
    if (debounceTimer) clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => { debounceTimer = null; run(); }, 80);
  }

  input.addEventListener('input', scheduleRun);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (e.shiftKey) goPrev(); else goNext();
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      goNext();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      goPrev();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      input.value = '';
      run();
      input.blur();
    }
  });
  btnNext.addEventListener('click', () => goNext());
  btnPrev.addEventListener('click', () => goPrev());
  btnClear.addEventListener('click', () => {
    input.value = '';
    run();
    input.focus();
  });

  // Click em row do dropdown -> troca pagina e re-aplica busca
  dropdown.addEventListener('click', (e) => {
    const row = e.target.closest('.vs-row');
    if (!row) return;
    const safe = row.getAttribute('data-page');
    if (!safe) return;
    const pname = pageName(safe);
    loadPage(safe, pname);  // loadPage chama varSearch.reapply() no final
    dropdown.classList.remove('open');
  });

  // Fecha dropdown ao clicar fora
  document.addEventListener('click', (e) => {
    if (!document.getElementById('var-search-wrap').contains(e.target)) {
      dropdown.classList.remove('open');
    }
  });
  input.addEventListener('focus', () => {
    if (input.value.trim()) {
      // re-mostra dropdown se ha resultados off-page
      renderDropdown(computeIndexMatches(input.value.trim().toLowerCase()).others);
    }
  });

  // Atalho global: "/" foca a busca (ignora se ja esta em input/textarea/contenteditable)
  document.addEventListener('keydown', (e) => {
    if (e.key !== '/' || e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    if (t === input) return;
    const tag = (t && t.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (t && t.isContentEditable)) return;
    e.preventDefault();
    input.focus();
    input.select();
  });

  // API publica pro loadPage()
  varSearch = {
    reapply() {
      if (!input.value.trim()) return;
      // Re-roda a busca na nova pagina; suprime o dropdown porque o usuario
      // acabou de escolher pra onde ir (ou veio de outro caminho).
      run({ suppressDropdown: true });
    }
  };
})();

// =============================================================================
// Checkboxes dos <group> -- estado persistido no servidor por DEVID
// =============================================================================
let groupState = {};   // {group_id (string): true}

async function loadGroupState() {
  try {
    const r = await fetch(withD('/group-state'));
    const d = await r.json();
    groupState = {};
    for (const id of (d.checked || [])) groupState[String(id)] = true;
    applyGroupState();
  } catch (e) {
    console.warn('falha ao carregar group-state:', e);
  }
}

function applyGroupState() {
  document.querySelectorAll('.group-grp').forEach(g => {
    const id = g.getAttribute('data-group-id');
    g.classList.toggle('checked', !!groupState[id]);
  });
}

document.getElementById('viewer').addEventListener('click', async (e) => {
  const cb = e.target.closest('.group-checkbox');
  if (!cb) return;
  const id = cb.getAttribute('data-group-id');
  if (!id) return;
  const next = !groupState[id];
  if (next) groupState[id] = true;
  else delete groupState[id];
  applyGroupState();
  try {
    await fetch(withD('/group-state'), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({group_id: id, checked: next})
    });
  } catch (err) {
    console.warn('falha ao salvar group-state:', err);
  }
});


// =============================================================================
// Bloco de notas -- abas Rele / Pagina, autosave por DEVID
// =============================================================================
let notesCtl = null;  // expose para hooks externos (page-switch)

(function setupNotes() {
  const panel    = document.getElementById('notes-panel');
  const editor   = document.getElementById('notes-editor');
  const toolbar  = document.getElementById('notes-toolbar');
  const tabsEl   = document.getElementById('notes-tabs');
  const toggleBt = document.getElementById('notes-toggle');
  const closeBt  = document.getElementById('notes-close');
  const statusEl = document.getElementById('notes-status');
  const pageNameEl = document.getElementById('notes-page-name');
  const OPEN_KEY = 'sel411-notes-open';
  const SCOPE_KEY = 'sel411-notes-scope';

  // Estado em memoria
  let scope = 'relay';   // 'relay' | 'page'
  let scopePage = null;  // safe page id quando scope==='page'
  let cache = { html_relay: '', pages: {} };
  let saveTimer = null;
  let lastSaved = '';
  let suppressInput = false;

  function setOpen(open) {
    document.body.classList.toggle('notes-open', open);
    panel.setAttribute('aria-hidden', open ? 'false' : 'true');
    toggleBt.setAttribute('aria-expanded', open ? 'true' : 'false');
    try { localStorage.setItem(OPEN_KEY, open ? '1' : '0'); } catch (e) {}
  }
  try { setOpen(localStorage.getItem(OPEN_KEY) === '1'); } catch (e) { setOpen(false); }

  toggleBt.addEventListener('click', () => {
    setOpen(!document.body.classList.contains('notes-open'));
    if (document.body.classList.contains('notes-open')) editor.focus();
  });
  closeBt.addEventListener('click', () => setOpen(false));

  // --- Helpers ---
  function pageDisplayName(safe) {
    if (!safe) return '-';
    for (const [name, s] of PAGES) if (s === safe) return name;
    return safe;
  }
  function currentContent() {
    if (scope === 'relay') return cache.html_relay || '';
    return (scopePage && cache.pages[scopePage]) || '';
  }
  function tabFor(s) {
    return tabsEl.querySelector(`.notes-tab[data-scope="${s}"]`);
  }
  function updateTabIndicators() {
    tabFor('relay').classList.toggle('has-note', !!(cache.html_relay && cache.html_relay.trim()));
    const pageHas = !!(scopePage && cache.pages[scopePage] && cache.pages[scopePage].trim());
    tabFor('page').classList.toggle('has-note', pageHas);
    updatePageNavIndicators();
  }
  function updatePageNavIndicators() {
    document.querySelectorAll('#pages button[data-page]').forEach(btn => {
      const safe = btn.getAttribute('data-page');
      const has = !!(cache.pages[safe] && cache.pages[safe].trim());
      btn.classList.toggle('has-note', has);
    });
  }
  function updatePageTabLabel() {
    pageNameEl.textContent = scopePage ? pageDisplayName(scopePage) : '-';
    // Pagina atual definida => habilita a aba; caso contrario, desabilita
    const tab = tabFor('page');
    tab.disabled = !scopePage;
    tab.style.opacity = scopePage ? '1' : '0.5';
  }
  function loadEditorFromScope() {
    suppressInput = true;
    editor.innerHTML = currentContent();
    lastSaved = editor.innerHTML;
    suppressInput = false;
    if (scope === 'page' && !scopePage) {
      statusEl.className = '';
      statusEl.textContent = '(sem página ativa)';
      editor.setAttribute('contenteditable', 'false');
    } else {
      editor.setAttribute('contenteditable', 'true');
      statusEl.className = '';
      statusEl.textContent = lastSaved ? 'salvo' : '-';
    }
  }
  function setActiveTab(s) {
    if (s === 'page' && !scopePage) return;   // não tem como ativar sem página
    if (scope === s) return;
    scope = s;
    tabsEl.querySelectorAll('.notes-tab').forEach(t => {
      const on = t.getAttribute('data-scope') === s;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    loadEditorFromScope();
    try { localStorage.setItem(SCOPE_KEY, s); } catch (e) {}
  }

  tabsEl.addEventListener('click', (e) => {
    const btn = e.target.closest('.notes-tab');
    if (!btn || btn.disabled) return;
    setActiveTab(btn.getAttribute('data-scope'));
    editor.focus();
  });

  // Toolbar
  toolbar.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-cmd]');
    if (!btn) return;
    e.preventDefault();
    const cmd = btn.getAttribute('data-cmd');
    const arg = btn.getAttribute('data-arg') || null;
    editor.focus();
    try { document.execCommand(cmd, false, arg); }
    catch (err) { console.warn('execCommand falhou:', cmd, err); }
    scheduleSave();
  });

  editor.addEventListener('input', () => { if (!suppressInput) scheduleSave(); });
  editor.addEventListener('blur', () => { if (saveTimer) flushSave(); });

  function scheduleSave() {
    if (saveTimer) clearTimeout(saveTimer);
    statusEl.className = 'saving';
    statusEl.textContent = '...';
    saveTimer = setTimeout(flushSave, 700);
  }
  async function flushSave() {
    saveTimer = null;
    if (scope === 'page' && !scopePage) return;
    const html = editor.innerHTML;
    if (html === lastSaved) {
      statusEl.className = ''; statusEl.textContent = 'salvo'; return;
    }
    // Atualiza cache local antes do POST para indicadores ficarem em sincronia
    if (scope === 'relay') cache.html_relay = html;
    else cache.pages[scopePage] = html;
    updateTabIndicators();
    try {
      const body = scope === 'relay'
        ? {scope: 'relay', html: html}
        : {scope: 'page', page: scopePage, html: html};
      const r = await fetch(withD('/note'), {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
      });
      if (!r.ok) throw new Error('http ' + r.status);
      lastSaved = html;
      statusEl.className = ''; statusEl.textContent = 'salvo';
    } catch (err) {
      statusEl.className = 'error'; statusEl.textContent = 'erro';
      console.warn('falha ao salvar nota:', err);
    }
  }

  async function loadNotes() {
    try {
      const r = await fetch(withD('/note'));
      const d = await r.json();
      cache.html_relay = d.html_relay || '';
      cache.pages = d.pages || {};
      // Restaura escopo preferido
      let saved = 'relay';
      try { saved = localStorage.getItem(SCOPE_KEY) || 'relay'; } catch (e) {}
      scope = (saved === 'page' && scopePage) ? 'page' : 'relay';
      tabsEl.querySelectorAll('.notes-tab').forEach(t => {
        const on = t.getAttribute('data-scope') === scope;
        t.classList.toggle('active', on);
        t.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      loadEditorFromScope();
      updateTabIndicators();
    } catch (err) {
      console.warn('falha ao carregar notas:', err);
    }
  }

  // API exposta para hooks externos (page-switch)
  notesCtl = {
    // Trocar de diagrama troca o rele, e portanto as notas inteiras.
    reload(safe) {
      if (saveTimer) flushSave();
      cache.html_relay = ''; cache.pages = {};
      scopePage = safe || null;
      updatePageTabLabel();
      loadNotes();
    },
    onPageChange(safe) {
      const wasPageScope = (scope === 'page');
      // Flush pendente se estivessemos editando uma nota de pagina
      if (saveTimer && wasPageScope) flushSave();
      scopePage = safe || null;
      updatePageTabLabel();
      // Se a aba ativa e Pagina, troca conteudo para a nova pagina
      if (wasPageScope) loadEditorFromScope();
      updateTabIndicators();
    },
  };

  // Define a pagina inicial ANTES de loadNotes() para que o escopo salvo
  // ('page') possa ser restaurado corretamente.
  scopePage = currentPage || null;
  updatePageTabLabel();
})();

// =============================================================================
// Ferramentas: Mouse (select) / Highlighter
// =============================================================================
let currentTool = 'select';
// highlightsState[pageSafeId] = Set(itemIds)
const highlightsState = {};

(function setupTools() {
  const btnSel = document.getElementById('tool-select');
  const btnHl  = document.getElementById('tool-highlight');
  const TOOL_KEY = 'sel411-current-tool';

  function applyTool(name) {
    currentTool = name;
    btnSel.classList.toggle('active', name === 'select');
    btnHl .classList.toggle('active', name === 'highlight');
    btnSel.setAttribute('aria-checked', name === 'select' ? 'true' : 'false');
    btnHl .setAttribute('aria-checked', name === 'highlight' ? 'true' : 'false');
    document.body.classList.toggle('tool-highlight', name === 'highlight');
    try { localStorage.setItem(TOOL_KEY, name); } catch (e) {}
  }
  try {
    const saved = localStorage.getItem(TOOL_KEY);
    applyTool(saved === 'highlight' ? 'highlight' : 'select');
  } catch (e) { applyTool('select'); }

  btnSel.addEventListener('click', () => applyTool('select'));
  btnHl .addEventListener('click', () => applyTool('highlight'));
})();

// =============================================================================
// Zoom / pan do diagrama
// O SVG e renderizado com viewBox + preserveAspectRatio, entao basta escalar a
// largura: zoom 1 = a largura util do #viewer, >1 estoura e o proprio #viewer
// (overflow:auto) vira a area de scroll. Como toda a matematica de coordenadas
// usa getScreenCTM(), marcador/rubber-band continuam corretos em qualquer zoom.
//
// Modos:
//   'page'   (padrao) -- pagina inteira ocupando o maximo possivel da tela
//   'width'           -- ajustado a largura (pode passar da altura -> scroll)
//   'manual'          -- usuario mexeu no +/-/roda; zoom fixo ate pedir ajuste
// Nos modos de ajuste o zoom e recalculado a cada troca de pagina e a cada
// mudanca de tamanho do #viewer (janela, painel lateral, quebra do header).
// =============================================================================
zoomCtl = (function setupZoom() {
  const viewer  = document.getElementById('viewer');
  const btnIn   = document.getElementById('zoom-in');
  const btnOut  = document.getElementById('zoom-out');
  const btnPct  = document.getElementById('zoom-level');
  const btnWide = document.getElementById('zoom-fit-width');
  const btnPage = document.getElementById('zoom-fit-page');
  if (!viewer || !btnIn) return null;

  const ZOOM_MIN = 0.15, ZOOM_MAX = 8, STEP = 1.25;
  const PAD = 24;          // padding do #viewer (12px de cada lado)
  const SAFETY = 0.995;    // folga pra barra de rolagem não reaparecer
  const ZOOM_KEY = 'sel411-gle-zoom';
  const MODE_KEY = 'sel411-gle-zoom-mode';
  let zoom = 1;
  let mode = 'page';

  function render() {
    viewer.style.setProperty('--gle-zoom', String(zoom));
    btnPct.textContent = Math.round(zoom * 100) + '%';
    btnIn.disabled  = zoom >= ZOOM_MAX - 1e-6;
    btnOut.disabled = zoom <= ZOOM_MIN + 1e-6;
    btnWide.classList.toggle('active', mode === 'width');
    btnPage.classList.toggle('active', mode === 'page');
    try {
      localStorage.setItem(ZOOM_KEY, String(zoom));
      localStorage.setItem(MODE_KEY, mode);
    } catch (e) {}
  }

  // anchor = {clientX, clientY} -- ponto da tela que deve continuar sob o cursor
  function setZoom(z, anchor) {
    const prev = zoom;
    zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
    if (Math.abs(zoom - prev) < 1e-9) { render(); return; }
    const rect = viewer.getBoundingClientRect();
    const ax = anchor ? anchor.clientX - rect.left : viewer.clientWidth / 2;
    const ay = anchor ? anchor.clientY - rect.top  : viewer.clientHeight / 2;
    // posicao do ponto no conteudo, normalizada pelo zoom anterior
    const cx = (viewer.scrollLeft + ax) / prev;
    const cy = (viewer.scrollTop  + ay) / prev;
    render();
    viewer.scrollLeft = cx * zoom - ax;
    viewer.scrollTop  = cy * zoom - ay;
  }

  function manualZoom(z, anchor) {
    mode = 'manual';
    setZoom(z, anchor);
  }

  // Zoom que faz a pagina inteira caber. Usa a proporcao do viewBox (e nao a
  // altura medida) pra nao depender do zoom atual nem da barra de rolagem.
  function pageZoom() {
    const svg = viewer.querySelector('svg');
    if (!svg) return null;
    const vb = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
    if (vb.length !== 4 || !vb[2] || !vb[3]) return null;
    const aspect = vb[3] / vb[2];                     // altura/largura do desenho
    const availW = viewer.clientWidth  - PAD;
    const availH = viewer.clientHeight - PAD;
    if (availW <= 0 || availH <= 0) return null;
    // largura(z) = availW*z  ->  altura(z) = availW*z*aspect <= availH
    return Math.min(1, (availH / (availW * aspect)) * SAFETY);
  }

  // Aplica o modo de ajuste corrente (no-op em 'manual')
  function applyFit(force) {
    if (mode === 'manual' && !force) return;
    const z = mode === 'width' ? 1 : pageZoom();
    if (z === null) return;
    const prev = zoom;
    zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, z));
    render();
    if (Math.abs(zoom - prev) > 1e-9) { viewer.scrollTop = 0; viewer.scrollLeft = 0; }
  }

  function fitPage()  { mode = 'page';  applyFit(true); }
  function fitWidth() { mode = 'width'; applyFit(true); }

  btnIn  .addEventListener('click', () => manualZoom(zoom * STEP));
  btnOut .addEventListener('click', () => manualZoom(zoom / STEP));
  btnPct .addEventListener('click', fitPage);
  btnWide.addEventListener('click', fitWidth);
  btnPage.addEventListener('click', fitPage);

  // Ctrl/Cmd + roda = zoom ancorado no cursor
  viewer.addEventListener('wheel', (e) => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    manualZoom(zoom * Math.exp(-e.deltaY * 0.0015), {clientX: e.clientX, clientY: e.clientY});
  }, {passive: false});

  // Atalhos: + / - / 0 (pagina inteira) / 9 (largura)
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const t = e.target;
    const tag = (t && t.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || (t && t.isContentEditable)) return;
    if (e.key === '+' || e.key === '=') { e.preventDefault(); manualZoom(zoom * STEP); }
    else if (e.key === '-' || e.key === '_') { e.preventDefault(); manualZoom(zoom / STEP); }
    else if (e.key === '0') { e.preventDefault(); fitPage(); }
    else if (e.key === '9') { e.preventDefault(); fitWidth(); }
  });

  // Reajusta quando o #viewer muda de tamanho (janela, painel lateral oculto,
  // header quebrando linha). Debounce por rAF; em 'manual' nao faz nada.
  let rafId = null, lastW = 0, lastH = 0;
  const onResize = () => {
    if (rafId) return;
    rafId = requestAnimationFrame(() => {
      rafId = null;
      const w = viewer.clientWidth, h = viewer.clientHeight;
      if (Math.abs(w - lastW) < 2 && Math.abs(h - lastH) < 2) return;
      lastW = w; lastH = h;
      applyFit(false);
    });
  };
  if (window.ResizeObserver) new ResizeObserver(onResize).observe(viewer);
  window.addEventListener('resize', onResize);

  // --- Pan: arrastar com o botao do meio (qualquer ferramenta) ou com o
  // esquerdo na ferramenta Mouse. So entra em modo pan depois de mover alguns
  // px, pra nao roubar cliques (ex.: checkbox de grupo).
  const PAN_THRESHOLD_PX = 4;
  let pan = null;

  viewer.addEventListener('mousedown', (e) => {
    const middle = e.button === 1;
    const leftSelect = e.button === 0 && currentTool === 'select' &&
                       !e.target.closest('.group-checkbox');
    if (!middle && !leftSelect) return;
    const scrollable = viewer.scrollWidth  > viewer.clientWidth + 1 ||
                       viewer.scrollHeight > viewer.clientHeight + 1;
    if (!scrollable) return;
    if (middle) e.preventDefault();
    pan = {
      x: e.clientX, y: e.clientY,
      left: viewer.scrollLeft, top: viewer.scrollTop,
      active: false,
    };
  });

  document.addEventListener('mousemove', (e) => {
    if (!pan) return;
    const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
    if (!pan.active) {
      if (Math.hypot(dx, dy) < PAN_THRESHOLD_PX) return;
      pan.active = true;
      document.body.classList.add('panning');
    }
    e.preventDefault();
    viewer.scrollLeft = pan.left - dx;
    viewer.scrollTop  = pan.top  - dy;
  });

  function endPan() {
    if (!pan) return;
    pan = null;
    document.body.classList.remove('panning');
  }
  document.addEventListener('mouseup', endPan);
  document.addEventListener('mouseleave', endPan);

  // Estado inicial: modo salvo (padrao 'page' -- diagrama ja preenchendo a tela)
  try {
    const savedMode = localStorage.getItem(MODE_KEY);
    if (savedMode === 'width' || savedMode === 'manual') mode = savedMode;
    const saved = parseFloat(localStorage.getItem(ZOOM_KEY));
    if (mode === 'manual' && isFinite(saved) && saved > 0) {
      zoom = Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, saved));
    }
  } catch (e) {}
  render();
  applyFit(false);
  // O layout so esta final depois do primeiro frame (fontes, header quebrando,
  // barra de rolagem do painel) -- reajusta uma vez.
  requestAnimationFrame(() => applyFit(false));
  window.addEventListener('load', () => applyFit(false));

  return {
    onPageChange() { applyFit(false); },
  };
})();

function connectionId(poly) {
  return 'c-' + (poly.getAttribute('data-src') || '?') +
         '-'  + (poly.getAttribute('data-src-port') || '0') +
         '-'  + (poly.getAttribute('data-dst') || '?') +
         '-'  + (poly.getAttribute('data-dst-port') || '0');
}

function findHighlightableTarget(eventTarget) {
  // Sobe pelo DOM ate achar um alvo "highlightavel". Ignora cliques em
  // checkboxes de <group>.
  if (eventTarget.closest('.group-checkbox')) return null;
  const block = eventTarget.closest('.symbol-grp, .gate-grp');
  if (block) return {kind: 'block', el: block, id: block.id};
  const poly = eventTarget.closest('polyline.connection');
  if (poly) return {kind: 'line', el: poly, id: connectionId(poly)};
  return null;
}

function applyBlockHighlight(blockEl) {
  if (blockEl.querySelector(':scope > .hl-overlay')) return;
  const rect = blockEl.querySelector('rect:not(.hl-overlay)');
  if (!rect) return;
  const x = parseFloat(rect.getAttribute('x'));
  const y = parseFloat(rect.getAttribute('y'));
  const w = parseFloat(rect.getAttribute('width'));
  const h = parseFloat(rect.getAttribute('height'));
  const pad = 2.5;
  const hl = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  hl.setAttribute('class', 'hl-overlay');
  hl.setAttribute('x', x - pad);
  hl.setAttribute('y', y - pad);
  hl.setAttribute('width', w + 2 * pad);
  hl.setAttribute('height', h + 2 * pad);
  hl.setAttribute('rx', '2.5');
  blockEl.insertBefore(hl, blockEl.firstChild);
  blockEl.classList.add('highlighted');
}

function removeBlockHighlight(blockEl) {
  const overlay = blockEl.querySelector(':scope > .hl-overlay');
  if (overlay) overlay.remove();
  blockEl.classList.remove('highlighted');
}

function applyLineHighlight(poly) {
  if (poly.parentNode.querySelector(
        `polyline.hl-line-overlay[data-for="${CSS.escape(connectionId(poly))}"]`)) return;
  const overlay = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
  overlay.setAttribute('class', 'hl-line-overlay');
  overlay.setAttribute('data-for', connectionId(poly));
  overlay.setAttribute('points', poly.getAttribute('points') || '');
  poly.parentNode.insertBefore(overlay, poly);
  poly.classList.add('highlighted');
}

function removeLineHighlight(poly) {
  const id = connectionId(poly);
  const overlay = poly.parentNode.querySelector(
    `polyline.hl-line-overlay[data-for="${CSS.escape(id)}"]`);
  if (overlay) overlay.remove();
  poly.classList.remove('highlighted');
}

function applyHighlightsForCurrentPage() {
  const ids = highlightsState[currentPage];
  if (!ids) return;
  const svg = document.querySelector('#viewer svg');
  if (!svg) return;
  ids.forEach(itemId => {
    if (itemId.startsWith('c-')) {
      svg.querySelectorAll('polyline.connection').forEach(p => {
        if (connectionId(p) === itemId) applyLineHighlight(p);
      });
    } else {
      const blk = svg.querySelector(`.symbol-grp#${CSS.escape(itemId)}, .gate-grp#${CSS.escape(itemId)}`);
      if (blk) applyBlockHighlight(blk);
    }
  });
}

async function loadHighlights() {
  try {
    const r = await fetch(withD('/highlights'));
    const d = await r.json();
    // Zera antes: os marcadores sao do rele do diagrama, nao do navegador.
    for (const k of Object.keys(highlightsState)) delete highlightsState[k];
    const pages = d.pages || {};
    for (const [pg, items] of Object.entries(pages)) {
      highlightsState[pg] = new Set(Object.keys(items || {}));
    }
    applyHighlightsForCurrentPage();
  } catch (e) {
    console.warn('falha ao carregar highlights:', e);
  }
}

async function postHighlight(page, itemId, highlighted) {
  try {
    await fetch(withD('/highlights'), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({page: page, item_id: itemId, highlighted: highlighted})
    });
  } catch (e) {
    console.warn('falha ao salvar highlight:', e);
  }
}

// --- Utilitarios de coordenadas / geometria em SVG ---
function svgPointFromEvent(svg, e) {
