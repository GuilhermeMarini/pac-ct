<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arquivos do Projeto &mdash; PAC CT</title>
<style>
  .files { width: 100%; border-collapse: collapse; }
  .files th { text-align: left; }
  .files td, .files th { padding: var(--s2) var(--s3); }
  .files tbody tr { border-top: 1px solid var(--border); }
  .files tr.dup { background: var(--surface-2); }
  .files .num { text-align: right; white-space: nowrap; }
  /* Baixar e Remover lado a lado: mesma pegada (`.btn` do tema), separados
     so pelo espaco -- a acao destrutiva nao ganha destaque nenhum. */
  .files .acts { white-space: nowrap; text-align: right; }
  .files .acts .btn { text-decoration: none; }
  /* Saida de ferramenta: some do texto, mas nao da linha. */
  .tag-gen {
    font-size: .85em; color: var(--text-2); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0 6px; white-space: nowrap;
  }
  .empty { color: var(--text-2); padding: var(--s5); text-align: center; }
  /* Recado de estado, e NAO um veredito: `.j` e' o carimbo de veredito, que no
     Caderno de Campo vem rotacionado (-4deg) e por isso montava por cima do
     que estivesse ao lado. Aqui a linha e' texto corrido, como nas outras
     ferramentas (#status.ok / #status.err). */
  #status {
    display: block; color: var(--text-2); font-size: .9em;
    min-height: 1.2em; margin-top: var(--s3);
  }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  #status.warn { color: var(--equiv); }
  /* Enquanto o lote sobe: o clique ja e' barrado pelo `busy` no JS, isto so
     conta a mesma coisa pro olho. */
  .drop.busy { opacity: .6; cursor: progress; }
</style>
</head>
<body>
<div class="page">
<header>
  <div>
    <h1>Arquivos do Projeto</h1>
    <div class="sub">RDB e SCD que as ferramentas v&atilde;o usar</div>
  </div>
  <span class="spacer"></span>
  <a class="lnk" href="/">&larr; Menu</a>
</header>
<div class="shell">
<!--NAV:files-->
<main class="col-main">
  <div class="panel">
    <label class="drop" id="drop">
      <span class="ic">[+]</span>
      <b>Enviar arquivo</b>
      <small>Clique ou arraste .rdb, .scd ou .xml &mdash; pode mandar v&aacute;rios de uma vez</small>
      <!-- Sem `accept`, de proposito. O filtro do `accept` e' quem monta a
           lista de tipos da janela do sistema, e a janela LEMBRA o filtro da
           vez anterior: no segundo envio ela reabria com um filtro mais
           estreito, o .scd sumia da lista e o "Abrir" ficava cinza -- o
           usuario via o arquivo e nao conseguia mandar. A validacao de tipo
           nao se perde: `kindFor()` em `library.js` recusa na hora, antes de
           subir um byte, contra a tabela que o servidor mandou no `page-data`,
           e o servidor recusa de novo. Melhor uma janela que mostra tudo do
           que uma que esconde o arquivo certo. -->
      <input type="file" id="file" multiple style="display:none">
    </label>
    <div id="status"></div>
  </div>

  <div class="panel">
    <h2>No projeto</h2>
    <table class="files">
      <thead>
        <tr>
          <th>Nome</th><th>Tipo</th><th class="num">Tamanho</th>
          <th>Conte&uacute;do</th><th>sha256</th><th class="num">A&ccedil;&otilde;es</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty">
      Nenhum arquivo ainda. Envie o RDB e o SCD do projeto acima &mdash;
      as ferramentas escolhem daqui, e o que elas gerarem volta pra c&aacute;.
    </div>
  </div>
</main>
</div>
</div>
<!-- O que o servidor tem a dizer a esta tela. Substituido em
     `handler.py`, lido por `PacPage.data()`. Vem ANTES do <script src>:
     o bloco tem que estar no documento quando o script roda. -->
<script type="application/json" id="page-data">${PAGE_DATA}</script>
<!-- Caminho absoluto de proposito: `mount.py` responde /static/ na raiz
     E sob qualquer prefixo, e o shim de prefixo nao reescreve `src`. -->
<script src="/static/js/files/library.js"></script>
</body>
</html>
