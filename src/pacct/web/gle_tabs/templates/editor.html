<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abas do GLE</title>
<style>
  /* Tokens e casca vem de /theme.css (pacct/web/themes/). Aqui fica so o que
     e' desta tela -- e nada de cor, raio, familia ou padding proprio. */

  .hint { color: var(--text-2); font-size: var(--fs-2); }

  /* A marca de veredito da casca e' `.j{display:inline-block}`, uma regra de
     AUTOR -- e regra de autor vence a do navegador seja qual for a
     especificidade, entao `hidden` sozinho nao esconde um `.j`. */
  [hidden] { display: none !important; }

  /* `.card` nao existe na casca solta (o que ela traz e' `.cards .card`, a
     grade de fichas do menu). Mesma ficha do Mapa DNP, so' com tokens. */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: var(--s4);
    margin-bottom: var(--s4);
  }
  .card h2 {
    margin: 0 0 var(--s3);
    font: var(--w-label) var(--fs-2) var(--cond);
    letter-spacing: var(--track);
    text-transform: uppercase;
    color: var(--text-2);
  }

  /* -- barra ------------------------------------------------------------- */
  /* Pegajosa pela mesma razao do Mapa DNP: um GLE de 40 abas empurra o estado
     para fora do olho de quem esta arrastando a aba 38. */
  .topbar {
    display: flex; gap: var(--s3); align-items: center; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 5;
    background: var(--surface);
    padding: var(--s2) 0;
    margin-bottom: var(--s3);
    border-bottom: 1px solid var(--border);
  }
  .topbar .gap { flex: 1 1 auto; }
  /* A tela esta adiantada em relacao ao arquivo. */
  .topbar .stuck { color: var(--err); }

  #tab-error:empty { display: none; }
  #tab-error {
    color: var(--err);
    border: 1px solid var(--err);
    border-radius: var(--radius);
    padding: var(--s2) var(--s3);
    margin-bottom: var(--s3);
    font-size: var(--fs-3);
  }

  /* -- a lista de abas ---------------------------------------------------- */
  #tab-list {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  #tab-list:empty { display: none; }
  .tab-head, .tab-row {
    display: grid;
    grid-template-columns:
      auto 3.5ch minmax(14ch, 24ch) 6ch minmax(0, 1fr) 7ch auto auto;
    gap: var(--s2);
    align-items: center;
    padding: var(--pad-cell);
    border-bottom: 1px solid var(--border-hair);
  }
  .tab-head {
    background: var(--surface-2);
    border-bottom: 2px solid var(--border-strong);
    font: var(--w-label) var(--fs-1) var(--cond);
    letter-spacing: var(--track);
    text-transform: uppercase;
    color: var(--text-2);
  }
  .tab-row:last-child { border-bottom: 0; }
  .tab-row:hover { background: var(--surface-2); }
  .tab-row.moved { background: var(--tint-displaced); }
  .tab-row.renamed .nm { border-color: var(--accent); }
  .tab-row.dragging { opacity: .4; }

  /* O sulco de destino. Antes era um contorno tracejado na linha inteira, que
     dizia SOBRE QUAL linha o ponteiro estava e nao ONDE a aba ia cair -- e as
     duas coisas diferem por uma posicao inteira. Agora e' um filete na fenda
     escolhida, acima ou abaixo conforme a metade da linha em que o ponteiro
     esta, que e' exatamente o indice para onde o splice vai. */
  .tab-row.drop-above { box-shadow: inset 0 3px 0 var(--accent); }
  .tab-row.drop-below { box-shadow: inset 0 -3px 0 var(--accent); }

  .tab-row .grip { cursor: grab; user-select: none; color: var(--text-2); }
  .tab-row .pos { font-family: var(--mono); font-size: var(--fs-3);
                  color: var(--text-2); font-variant-numeric: tabular-nums; }
  .tab-row .nm {
    width: 100%;
    background: var(--surface-3);
    color: var(--text);
    border: 1px solid var(--border-ctl);
    border-radius: var(--radius);
    padding: var(--pad-field);
    font: inherit;
    font-size: var(--fs-3);
  }
  .tab-row .cnt { font: 400 var(--fs-2) var(--mono); color: var(--text-2);
                  font-variant-numeric: tabular-nums; text-align: right; }
  /* `at-limit`, e nao `full`: a casca ja tem uma classe `.full` (o miolo de
     largura inteira, com padding proprio), e um `class="cnt full"` herdava
     aquele padding -- a linha com o nome no limite ficava 36px mais alta. */
  .tab-row .cnt.at-limit { color: var(--warn); }
  .tab-row .desc { color: var(--text-2); font-size: var(--fs-2);
                   overflow: hidden; text-overflow: ellipsis;
                   white-space: nowrap; }
  .tab-row .els { font: 400 var(--fs-2) var(--mono); color: var(--text-2);
                  text-align: right; white-space: nowrap; }
  .tab-row .marks { display: flex; gap: var(--s2); white-space: nowrap; }
  .tab-row .arrows { display: flex; gap: var(--s1); }
  .arrow {
    font: inherit;
    font-size: var(--fs-3);
    line-height: 1;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border-ctl);
    border-radius: var(--radius);
    padding: var(--s1) var(--s2);
    cursor: pointer;
  }
  .arrow:hover:not(:disabled) { background: var(--surface-2);
                                border-color: var(--accent-strong); }
  .arrow:disabled { opacity: .45; cursor: not-allowed; }
</style>
</head>
<body>
<div class="page">
<header>
  <div>
    <h1>Abas do GLE</h1>
    <div class="sub" id="sub">&nbsp;</div>
  </div>
  <span class="spacer"></span>
  <a class="lnk" id="back" href="./">&#x2190; RDB</a>
  <a class="lnk" href="/" title="Voltar ao menu de ferramentas">Menu</a>
</header>
<div class="shell">
<!--NAV:gle-tabs-->
<div class="grid">
<main class="col-main">

  <section class="card">
    <div class="topbar">
      <span id="tabs-title" class="hint"></span>
      <button id="undo" type="button" class="btn" disabled>Desfazer</button>
      <span class="gap"></span>
      <span id="tabs-count" class="count"></span>
    </div>
    <div id="tab-error" role="alert"></div>
    <div id="tab-list"></div>
    <p class="hint" id="tabs-help"></p>
  </section>

</main>
</div>
</div>
</div>
<script src="/static/js/gle_tabs/editor.js"></script>
</body>
</html>
